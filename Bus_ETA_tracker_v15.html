<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港巴士、小巴與鐵路實時 ETA 查詢平台 (v15)</title>
  <style>
    :root {
      --primary-color: #0056b3;
      --bg-color: #f4f7f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e0e0e0;
      --accent-kmb: #e60012;
      --accent-ctb: #f5a623;
      --accent-nlb: #2c6e49;
      --accent-mtr: #00706a;
      --accent-mtrl: #9b2d9b;
      --accent-lrt: #d35400;
      --accent-gmb: #27ae60;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 850px;
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      font-size: 1.6rem;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    .search-box {
      position: relative;
      margin-bottom: 12px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 1.1rem;
      border: 2px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary-color);
    }

    .status-hint {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 16px;
      padding-left: 4px;
    }

    .autocomplete-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid #ddd;
      border-radius: 0 0 8px 8px;
      max-height: 480px;
      overflow-y: auto;
      z-index: 1000;
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    }

    .autocomplete-item {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .autocomplete-item:hover {
      background-color: #eef5ff;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      color: white;
      white-space: nowrap;
    }

    .badge-kmb { background-color: var(--accent-kmb); }
    .badge-ctb { background-color: var(--accent-ctb); color: #222; }
    .badge-nlb { background-color: var(--accent-nlb); }
    .badge-mtr { background-color: var(--accent-mtr); }
    .badge-mtrl { background-color: var(--accent-mtrl); }
    .badge-lrt { background-color: var(--accent-lrt); }
    .badge-gmb { background-color: var(--accent-gmb); }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #e8f4fd;
      border: 1px solid #b6e0fe;
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      color: #004085;
      flex-wrap: wrap;
      gap: 10px;
    }

    .timer-badge {
      background: #0056b3;
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    .direction-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .dir-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid var(--border-color);
    }

    .dir-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--primary-color);
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 8px;
      margin-bottom: 14px;
    }

    .dir-sub {
      display: block;
      font-size: 0.8rem;
      font-weight: normal;
      color: #666;
      margin-top: 4px;
    }

    .stop-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .stop-item {
      padding: 12px 0;
      border-bottom: 1px dashed #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .stop-name {
      font-weight: 500;
      font-size: 1rem;
      color: #222;
    }

    .eta-box {
      text-align: right;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .eta-slot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.88rem;
      border: 1px solid #ddd;
      background: #ffffff;
    }

    .eta-slot .eta-label {
      font-weight: bold;
      color: #555;
      padding-right: 4px;
      border-right: 1px solid rgba(0,0,0,0.15);
    }

    .eta-slot .eta-value { font-weight: bold; }

    .eta-slot.eta-realtime { background: #e1f5fe; border-color: #81d4fa; }
    .eta-slot.eta-realtime .eta-value { color: #0288d1; }

    .eta-slot.eta-now { background: #e8f5e9; border-color: #a5d6a7; }
    .eta-slot.eta-now .eta-value { color: #2e7d32; }

    .eta-slot.eta-scheduled { background: #fff3e0; border-color: #ffe0b2; }
    .eta-slot.eta-scheduled .eta-value { color: #e65100; }

    .eta-slot.eta-empty { background: #f5f5f5; border-color: #e0e0e0; }
    .eta-slot.eta-empty .eta-value { color: #9e9e9e; }

    .loading {
      text-align: center;
      color: #666;
      font-style: italic;
      padding: 30px;
      background: white;
      border-radius: 8px;
      border: 1px dashed #ccc;
    }

    .btn-refresh {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      transition: background-color 0.2s, transform 0.1s;
      margin-right: 10px;
    }

    .btn-refresh:hover { background-color: #004085; }
    .btn-refresh:active { transform: scale(0.96); }
    .btn-refresh:disabled { opacity: 0.6; cursor: not-allowed; }

    .status-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .slot-select {
      padding: 4px 8px;
      font-size: 0.88rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      background-color: #fff;
      font-weight: bold;
      color: #333;
      margin-right: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🚍 香港巴士 / 小巴 / 鐵路 ETA 實時到站查詢 (v15)</h1>

  <div class="search-box">
    <input type="text" id="routeInput" placeholder="輸入路線編號或鐵路綫 (例: 5B, 116, TWL, 荃灣, 505)..." autocomplete="off">
    <div id="autocompleteList" class="autocomplete-list" style="display:none;"></div>
  </div>
  <div id="initStatus" class="status-hint">⏳ 正在載入巴士、小巴、港鐵及輕鐵路線資料...</div>

  <div id="statusBar" class="status-bar" style="display:none;">
    <span>正在檢視路線：<strong id="activeRouteName">--</strong></span>
    <div class="status-controls">
      <label for="slotCountSelect" style="font-size:0.88rem; font-weight:bold; margin-right:4px;">顯示班次：</label>
      <select id="slotCountSelect" class="slot-select" onchange="handleSlotCountChange(this.value)">
        <option value="1">1 班</option>
        <option value="2" selected>2 班</option>
        <option value="3">3 班</option>
      </select>
      <button id="manualRefreshBtn" class="btn-refresh" onclick="manualRefresh()">🔄 手動刷新</button>
      <span>下次自動更新：<span id="countdownTimer" class="timer-badge">15</span> 秒</span>
    </div>
  </div>

  <div id="results" class="direction-container"></div>
</div>

<script>
  const API = {
    KMB_ROUTES: 'https://data.etabus.gov.hk/v1/transport/kmb/route/',
    KMB_ROUTE_STOPS: 'https://data.etabus.gov.hk/v1/transport/kmb/route-stop/',
    KMB_STOP: 'https://data.etabus.gov.hk/v1/transport/kmb/stop/',
    KMB_ETA: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/',
    GMB_ROUTES: 'https://data.etagmb.gov.hk/route',
    GMB_ROUTE_STOPS: 'https://data.etagmb.gov.hk/route-stop/',
    GMB_ETA: 'https://data.etagmb.gov.hk/eta/route-stop/',
    CTB_ROUTES: 'https://rt.data.gov.hk/v2/transport/citybus/route/CTB',
    CTB_ROUTE_STOPS: 'https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/',
    CTB_STOP: 'https://rt.data.gov.hk/v2/transport/citybus/stop/',
    CTB_ETA: 'https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/',
    NLB_ROUTE_LIST: 'https://rt.data.gov.hk/v1/transport/nlb/route.php?action=list',
    NLB_STOP_LIST: 'https://rt.data.gov.hk/v1/transport/nlb/stop.php?action=list',
    NLB_ETA: 'https://rt.data.gov.hk/v1/transport/nlb/stop.php?action=estimatedArrivals',
    MTR_BUS_ROUTES: 'https://opendata.mtr.com.hk/data/mtr_bus_routes.csv',
    MTR_BUS_STOPS: 'https://opendata.mtr.com.hk/data/mtr_bus_stops.csv',
    MTR_BUS_ETA: 'https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule',
    MTR_LINES_STATIONS: 'https://opendata.mtr.com.hk/data/mtr_lines_and_stations.csv',
    MTR_NEXT_TRAIN: 'https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php',
    LRT_ROUTES_STOPS: 'https://opendata.mtr.com.hk/data/light_rail_routes_and_stops.csv',
    LRT_NEXT_TRAIN: 'https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule'
  };

  const TYPE_ORDER = { KMB: 0, CTB: 1, NLB: 2, MTRB: 3, MTRL: 4, LRT: 5, GMB: 6 };
  const BADGE_CLASS = { KMB: 'badge-kmb', CTB: 'badge-ctb', NLB: 'badge-nlb', MTRB: 'badge-mtr', MTRL: 'badge-mtrl', LRT: 'badge-lrt', GMB: 'badge-gmb' };

  const MTR_LINE_NAME = {
    AEL: '機場快綫', TCL: '東涌綫', TML: '屯馬綫', TKL: '將軍澳綫', EAL: '東鐵綫',
    SIL: '南港島綫', TWL: '荃灣綫', ISL: '港島綫', KTL: '觀塘綫', DRL: '迪士尼綫'
  };
  const MTR_DIR_LABEL = { UT: '上行', DT: '下行', 'LMC-UT': '落馬洲上行', 'LMC-DT': '落馬洲下行' };

  const REGION_LABEL = { HKI: '港島', KLN: '九龍', NT: '新界' };

  let rawKmbRoutes = [];
  let searchIndex = [];
  let selectedRoute = null;
  let refreshTimer = null;
  let countdownTimer = null;
  let secondsRemaining = 15;
  let isRoutesLoaded = false;
  let displaySlotCount = 2;
  const gmbDetailCache = new Map();
  const kmbStopNameCache = new Map();
  const ctbStopNameCache = new Map();
  let rawNlbRoutes = [];
  let mtrBusStops = [];
  let mtrRailStations = [];
  let lrtStops = [];
  const mtrStationNameByCode = new Map();
  let activeRequestToken = 0;

  async function fetchJson(url) {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status} ${url}`);
    return res.json();
  }

  async function fetchJsonPost(url, body) {
    const res = await fetch(url, {
      method: 'POST',
      cache: 'no-store',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
    if (!res.ok) throw new Error(`HTTP ${res.status} ${url}`);
    return res.json();
  }

  function parseCsv(text) {
    const rows = [];
    const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/).filter(Boolean);
    if (!lines.length) return rows;
    const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(',').map(c => c.trim().replace(/^"|"$/g, ''));
      const obj = {};
      headers.forEach((h, idx) => { obj[h] = (cols[idx] || '').trim(); });
      rows.push(obj);
    }
    return rows;
  }

  async function mapPool(items, limit, worker) {
    const results = new Array(items.length);
    let cursor = 0;
    async function run() {
      while (cursor < items.length) {
        const i = cursor++;
        results[i] = await worker(items[i], i);
      }
    }
    const n = Math.min(limit, items.length);
    await Promise.all(Array.from({ length: n }, run));
    return results;
  }

  function uniqueKey(item) {
    if (item.type === 'KMB') return `KMB:${item.route}`;
    return `GMB:${item.region}:${item.route}`;
  }

  async function initRoutes() {
    const statusHint = document.getElementById('initStatus');
    const regions = ['HKI', 'KLN', 'NT'];

    const kmbTask = fetchJson(API.KMB_ROUTES)
      .then(data => data.data || [])
      .catch(e => {
        console.error('九巴資料載入失敗', e);
        return [];
      });

    const ctbTask = fetchJson(API.CTB_ROUTES)
      .then(data => (data.data || []).map(r => ({
        type: 'CTB',
        company: '城巴',
        route: r.route,
        orig: r.orig_tc,
        dest: r.dest_tc
      })))
      .catch(e => {
        console.error('城巴資料載入失敗', e);
        return [];
      });

    const nlbTask = fetchJsonPost(API.NLB_ROUTE_LIST, {})
      .then(data => {
        rawNlbRoutes = data.routes || [];
        return rawNlbRoutes.map(r => ({
          type: 'NLB',
          company: '嶼巴',
          route: String(r.routeNo),
          routeId: r.routeId,
          origDest: r.routeName_c || r.routeName_e,
          overnight: r.overnightRoute,
          special: r.specialRoute
        }));
      })
      .catch(e => {
        console.error('嶼巴資料載入失敗', e);
        return [];
      });

    const mtrTask = Promise.all([
      fetch(API.MTR_BUS_ROUTES).then(r => r.text()),
      fetch(API.MTR_BUS_STOPS).then(r => r.text())
    ]).then(([routeText, stopText]) => {
      const routes = parseCsv(routeText);
      mtrBusStops = parseCsv(stopText);
      const seen = new Set();
      const list = [];
      routes.forEach(r => {
        const id = r.ROUTE_ID;
        if (!id || seen.has(id)) return;
        seen.add(id);
        list.push({
          type: 'MTRB',
          company: '港鐵巴士',
          route: id,
          origDest: r.ROUTE_NAME_CHI || r.ROUTE_NAME_ENG,
          circular: r.IS_CIRCULAR === '1'
        });
      });
      return list;
    }).catch(e => {
      console.error('港鐵巴士資料載入失敗', e);
      mtrBusStops = [];
      return [];
    });

    const mtrRailTask = fetch(API.MTR_LINES_STATIONS).then(r => r.text()).then(text => {
      mtrRailStations = parseCsv(text);
      mtrStationNameByCode.clear();
      mtrRailStations.forEach(s => {
        const code = s['Station Code'] || s.STATION_CODE;
        if (code && !mtrStationNameByCode.has(code)) {
          mtrStationNameByCode.set(code, s['Chinese Name'] || s.CHINESE_NAME || code);
        }
      });
      const byLine = {};
      mtrRailStations.forEach(s => {
        const line = s['Line Code'] || s.LINE_CODE;
        if (!line) return;
        if (!byLine[line]) byLine[line] = [];
        byLine[line].push(s);
      });
      return Object.keys(byLine).sort().map(line => {
        const name = MTR_LINE_NAME[line] || line;
        const dirs = {};
        byLine[line].forEach(s => {
          const d = s.Direction || s.DIRECTION || 'UT';
          if (!dirs[d]) dirs[d] = [];
          dirs[d].push(s);
        });
        Object.keys(dirs).forEach(d => dirs[d].sort((a, b) => Number(a.Sequence || a.SEQUENCE) - Number(b.Sequence || b.SEQUENCE)));
        const mainDir = dirs.UT || dirs.DT || dirs[Object.keys(dirs)[0]] || [];
        const first = mainDir[0];
        const last = mainDir[mainDir.length - 1];
        const orig = first ? (first['Chinese Name'] || first.CHINESE_NAME) : '';
        const dest = last ? (last['Chinese Name'] || last.CHINESE_NAME) : '';
        return {
          type: 'MTRL',
          company: '港鐵',
          route: line,
          orig,
          dest,
          origDest: `${name}（${orig} ↔ ${dest}）`,
          searchText: `${line} ${name} ${orig} ${dest} 港鐵`,
          stationsByDir: dirs
        };
      });
    }).catch(e => {
      console.error('港鐵綫資料載入失敗', e);
      mtrRailStations = [];
      return [];
    });

    const lrtTask = fetch(API.LRT_ROUTES_STOPS).then(r => r.text()).then(text => {
      lrtStops = parseCsv(text);
      const byRoute = {};
      lrtStops.forEach(s => {
        const code = String(s['Line Code'] || s.LINE_CODE || '');
        if (!code) return;
        if (!byRoute[code]) byRoute[code] = [];
        byRoute[code].push(s);
      });
      return Object.keys(byRoute).sort((a, b) => a.localeCompare(b, undefined, { numeric: true })).map(code => {
        const dirs = {};
        byRoute[code].forEach(s => {
          const d = String(s.Direction || s.DIRECTION || '1');
          if (!dirs[d]) dirs[d] = [];
          dirs[d].push(s);
        });
        Object.keys(dirs).forEach(d => dirs[d].sort((a, b) => Number(a.Sequence || a.SEQUENCE) - Number(b.Sequence || b.SEQUENCE)));
        const d1 = dirs['1'] || dirs[Object.keys(dirs)[0]] || [];
        const orig = d1[0] ? (d1[0]['Chinese Name'] || d1[0].CHINESE_NAME) : '';
        const dest = d1.length ? (d1[d1.length - 1]['Chinese Name'] || d1[d1.length - 1].CHINESE_NAME) : '';
        return {
          type: 'LRT',
          company: '輕鐵',
          route: code,
          orig,
          dest,
          origDest: `${orig} ↔ ${dest}`,
          searchText: `${code} 輕鐵 ${orig} ${dest}`,
          stopsByDir: dirs
        };
      });
    }).catch(e => {
      console.error('輕鐵資料載入失敗', e);
      lrtStops = [];
      return [];
    });

    const gmbTasks = regions.map(region =>
      fetchJson(`${API.GMB_ROUTES}/${region}`)
        .then(data => {
          const codes = data?.data?.routes;
          if (!Array.isArray(codes)) return [];
          return codes.map(code => ({
            type: 'GMB',
            company: '綠色小巴',
            region,
            route: String(code),
            description: ''
          }));
        })
        .catch(e => {
          console.warn(`綠色小巴 (${region}) 載入失敗`, e);
          return [];
        })
    );

    try {
      const [kmbData, ctbRoutes, nlbRoutes, mtrRoutes, mtrRailRoutes, lrtRoutes, ...gmbRegionResults] = await Promise.all([
        kmbTask, ctbTask, nlbTask, mtrTask, mtrRailTask, lrtTask, ...gmbTasks
      ]);
      rawKmbRoutes = kmbData;
      const gmbRoutes = gmbRegionResults.flat();

      const kmbGrouped = {};
      rawKmbRoutes.forEach(r => {
        if (!kmbGrouped[r.route]) kmbGrouped[r.route] = [];
        kmbGrouped[r.route].push(r);
      });

      const kmbUniqueList = Object.entries(kmbGrouped).map(([route, variants]) => {
        const main = variants.find(v => String(v.service_type) === '1' && v.bound === 'O')
          || variants.find(v => String(v.service_type) === '1')
          || variants[0];
        return {
          type: 'KMB',
          company: '九巴/龍運',
          route,
          orig: main.orig_tc,
          dest: main.dest_tc,
          variants
        };
      });

      searchIndex = [...kmbUniqueList, ...ctbRoutes, ...nlbRoutes, ...mtrRoutes, ...mtrRailRoutes, ...lrtRoutes, ...gmbRoutes];
      isRoutesLoaded = true;
      statusHint.innerHTML = `✅ 資料載入完成！九巴/龍運 <strong>${kmbUniqueList.length}</strong>、城巴 <strong>${ctbRoutes.length}</strong>、嶼巴 <strong>${nlbRoutes.length}</strong>、港鐵巴士 <strong>${mtrRoutes.length}</strong>、港鐵綫 <strong>${mtrRailRoutes.length}</strong>、輕鐵 <strong>${lrtRoutes.length}</strong>、綠色小巴編號 <strong>${gmbRoutes.length}</strong>。選線後才抓車站與 ETA。`;
      statusHint.style.color = '#27ae60';
      handleSearch();
    } catch (e) {
      console.error('路線資料初始化失敗', e);
      statusHint.innerHTML = '⚠️ 路線資料初始化失敗，請檢查網路連線或重新整理網頁。';
      statusHint.style.color = '#e60012';
    }
  }

  initRoutes();

  const routeInput = document.getElementById('routeInput');
  const autocompleteList = document.getElementById('autocompleteList');

  function sortMatches(filtered, query) {
    return filtered.sort((a, b) => {
      const routeA = a.route.toUpperCase();
      const routeB = b.route.toUpperCase();
      const exactA = routeA === query;
      const exactB = routeB === query;
      if (exactA && !exactB) return -1;
      if (!exactA && exactB) return 1;
      const startsA = routeA.startsWith(query);
      const startsB = routeB.startsWith(query);
      if (startsA && !startsB) return -1;
      if (!startsA && startsB) return 1;
      if (a.type !== b.type) return (TYPE_ORDER[a.type] ?? 9) - (TYPE_ORDER[b.type] ?? 9);
      if (routeA.length !== routeB.length) return routeA.length - routeB.length;
      return routeA.localeCompare(routeB);
    });
  }

  function routeLabel(item) {
    if (item.type === 'KMB' || item.type === 'CTB') {
      return `${item.route}（${item.orig || '?'} ↔ ${item.dest || '?'}）`;
    }
    if (item.type === 'NLB') {
      return `${item.route}（${item.origDest || '嶼巴'}）`;
    }
    if (item.type === 'MTRB') {
      return `${item.route}（${item.origDest || '港鐵巴士'}）`;
    }
    if (item.type === 'MTRL') {
      return `${item.route} ${MTR_LINE_NAME[item.route] || ''}（${item.orig || '?'} ↔ ${item.dest || '?'}）`;
    }
    if (item.type === 'LRT') {
      return `${item.route}（${item.origDest || '輕鐵'}）`;
    }
    const region = REGION_LABEL[item.region] || item.region;
    if (item.detailSummary) return `${item.route} · ${region}（${item.detailSummary}）`;
    return `${item.route} · ${region}專線小巴`;
  }

  function renderAutocomplete(filtered) {
    autocompleteList.innerHTML = '';
    if (!filtered.length) {
      autocompleteList.style.display = 'none';
      return;
    }
    filtered.slice(0, 80).forEach(item => {
      const div = document.createElement('div');
      div.className = 'autocomplete-item';
      const badgeClass = BADGE_CLASS[item.type] || 'badge-kmb';
      div.innerHTML = `
        <span><strong>${item.route}</strong> <small style="color:#666; margin-left:8px;">${routeLabel(item)}</small></span>
        <span class="badge ${badgeClass}">${item.company}</span>
      `;
      div.addEventListener('click', () => {
        routeInput.value = item.route;
        autocompleteList.style.display = 'none';
        selectRoute(item);
      });
      autocompleteList.appendChild(div);
    });
    autocompleteList.style.display = 'block';
  }

  async function enrichGmbMatches(matches) {
    const targets = matches.filter(m => m.type === 'GMB' && !gmbDetailCache.has(`${m.region}:${m.route}`)).slice(0, 12);
    await mapPool(targets, 4, async (item) => {
      try {
        const details = await loadGmbRouteDetails(item.region, item.route);
        item.detailSummary = summarizeGmbDetails(details);
      } catch (e) {
        console.warn('GMB 詳情預載失敗', item, e);
      }
    });
  }

  function summarizeGmbDetails(details) {
    if (!details?.length) return '';
    const first = details[0];
    const dir = first.directions?.[0];
    const extra = details.length > 1 ? ` 等 ${details.length} 個班次類型` : '';
    if (!dir) return first.description_tc || '';
    return `${dir.orig_tc} ↔ ${dir.dest_tc}${extra}`;
  }

  async function handleSearch() {
    const query = routeInput.value.trim().toUpperCase();
    if (!query || !isRoutesLoaded) {
      autocompleteList.style.display = 'none';
      return;
    }
    const filtered = sortMatches(
      searchIndex.filter(r => {
        if (r.route.toUpperCase().includes(query)) return true;
        const extra = `${r.searchText || ''} ${r.origDest || ''} ${r.orig || ''} ${r.dest || ''} ${r.company || ''}`;
        return extra.toUpperCase().includes(query);
      }),
      query
    );
    renderAutocomplete(filtered);
    if (filtered.some(x => x.type === 'GMB')) {
      await enrichGmbMatches(filtered);
      if (routeInput.value.trim().toUpperCase() === query) renderAutocomplete(filtered);
    }
  }

  routeInput.addEventListener('input', handleSearch);

  document.addEventListener('click', (e) => {
    if (!routeInput.contains(e.target) && !autocompleteList.contains(e.target)) {
      autocompleteList.style.display = 'none';
    }
  });

  async function loadGmbRouteDetails(region, route) {
    const key = `${region}:${route}`;
    if (gmbDetailCache.has(key)) return gmbDetailCache.get(key);
    const data = await fetchJson(`${API.GMB_ROUTES}/${region}/${encodeURIComponent(route)}`);
    const details = Array.isArray(data.data) ? data.data : [];
    gmbDetailCache.set(key, details);
    return details;
  }

  function selectRoute(routeItem) {
    selectedRoute = routeItem;
    const statusBar = document.getElementById('statusBar');
    const activeRouteName = document.getElementById('activeRouteName');
    statusBar.style.display = 'flex';
    let extra = '';
    if (routeItem.type === 'GMB') extra = `（${REGION_LABEL[routeItem.region] || routeItem.region}）`;
    if (routeItem.type === 'NLB' && routeItem.origDest) extra = `（${routeItem.origDest}）`;
    if (routeItem.type === 'MTRB' && routeItem.origDest) extra = `（${routeItem.origDest}）`;
    if (routeItem.type === 'MTRL') extra = `（${MTR_LINE_NAME[routeItem.route] || routeItem.route}）`;
    if (routeItem.type === 'LRT' && routeItem.origDest) extra = `（${routeItem.origDest}）`;
    activeRouteName.innerText = `${routeItem.company} - ${routeItem.route}${extra}`;
    fetchAndDisplayETA(selectedRoute);
    resetAutoRefresh();
  }

  function resetAutoRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);
    if (countdownTimer) clearInterval(countdownTimer);
    secondsRemaining = 15;
    document.getElementById('countdownTimer').innerText = secondsRemaining;

    countdownTimer = setInterval(() => {
      secondsRemaining--;
      if (secondsRemaining <= 0) secondsRemaining = 15;
      document.getElementById('countdownTimer').innerText = secondsRemaining;
    }, 1000);

    refreshTimer = setInterval(() => {
      if (selectedRoute) fetchAndDisplayETA(selectedRoute, true);
    }, 15000);
  }

  async function fetchAndDisplayETA(routeInfo, isSilentRefresh = false) {
    const token = ++activeRequestToken;
    const resultsContainer = document.getElementById('results');
    if (!isSilentRefresh) {
      resultsContainer.innerHTML = '<div class="loading">正在實時查詢車站及到站時間 (ETA)...</div>';
    }
    try {
      if (routeInfo.type === 'KMB') {
        await loadKmbRouteData(routeInfo, isSilentRefresh, token);
      } else if (routeInfo.type === 'GMB') {
        await loadGmbRouteData(routeInfo, isSilentRefresh, token);
      } else if (routeInfo.type === 'CTB') {
        await loadCtbRouteData(routeInfo, isSilentRefresh, token);
      } else if (routeInfo.type === 'NLB') {
        await loadNlbRouteData(routeInfo, isSilentRefresh, token);
      } else if (routeInfo.type === 'MTRB') {
        await loadMtrBusRouteData(routeInfo, isSilentRefresh, token);
      } else if (routeInfo.type === 'MTRL') {
        await loadMtrRailRouteData(routeInfo, isSilentRefresh, token);
      } else if (routeInfo.type === 'LRT') {
        await loadLrtRouteData(routeInfo, isSilentRefresh, token);
      }
    } catch (e) {
      console.error(e);
      if (!isSilentRefresh && token === activeRequestToken) {
        resultsContainer.innerHTML = '<div class="loading">資料載入失敗，請稍後再試。</div>';
      }
    }
  }

  function kmbDirPath(bound) {
    return bound === 'I' ? 'inbound' : 'outbound';
  }

  function kmbDirCode(pathOrBound) {
    if (pathOrBound === 'inbound' || pathOrBound === 'I') return 'I';
    return 'O';
  }

  async function loadKmbRouteData(routeInfo, isSilentRefresh, token) {
    const resultsContainer = document.getElementById('results');
    const variants = rawKmbRoutes.filter(r => r.route === routeInfo.route);
    const jobs = variants.map(variant => ({
      route: variant.route,
      bound: variant.bound,
      serviceType: String(variant.service_type),
      orig: variant.orig_tc,
      dest: variant.dest_tc
    }));

    if (!isSilentRefresh && token === activeRequestToken) resultsContainer.innerHTML = '';

    for (const job of jobs) {
      if (token !== activeRequestToken) return;
      const dirPath = kmbDirPath(job.bound);
      const containerId = `kmb-card-${job.route}-${dirPath}-${job.serviceType}`;
      const isSpecial = job.serviceType !== '1';
      const specialSuffix = isSpecial ? '[特別班次]' : '';
      const dirWord = job.bound === 'I' ? '回程' : '去程';

      try {
        const data = await fetchJson(`${API.KMB_ROUTE_STOPS}${job.route}/${dirPath}/${job.serviceType}`);
        const stops = (data.data || []).slice().sort((a, b) => Number(a.seq) - Number(b.seq));
        if (!stops.length) continue;

        let card = document.getElementById(containerId);
        if (!card) {
          if (isSilentRefresh) continue;
          card = document.createElement('div');
          card.id = containerId;
          card.className = 'dir-card';
          card.innerHTML = `<div class="dir-title">${dirWord}：${job.orig} ➔ ${job.dest}${specialSuffix}<span class="dir-sub">九巴/龍運 ${job.route}</span></div><ul class="stop-list"></ul>`;
          resultsContainer.appendChild(card);
        }

        const stopListEl = card.querySelector('.stop-list');
        stops.forEach((stopRef) => {
          const stopItemId = `kmb-stop-${containerId}-${stopRef.seq}-${stopRef.stop}`;
          if (document.getElementById(stopItemId)) return;
          if (isSilentRefresh) return;
          const stopItem = document.createElement('li');
          stopItem.id = stopItemId;
          stopItem.className = 'stop-item';
          stopItem.innerHTML = `<span class="stop-name">${stopRef.seq}. 載入中...</span><div class="eta-box">...</div>`;
          stopListEl.appendChild(stopItem);
        });
        await mapPool(stops, 6, async (stopRef) => {
          if (token !== activeRequestToken) return;
          const stopItemId = `kmb-stop-${containerId}-${stopRef.seq}-${stopRef.stop}`;
          let stopItem = document.getElementById(stopItemId);
          if (!stopItem) return;

          try {
            const stopName = await getKmbStopName(stopRef.stop);
            const etaData = await fetchJson(`${API.KMB_ETA}${stopRef.stop}/${job.route}/${job.serviceType}`);
            const wantDir = kmbDirCode(job.bound);
            const wantSt = String(job.serviceType);
            const rawEtas = (etaData.data || []).filter(e => {
              const sameDir = e.dir === wantDir;
              const sameSt = e.service_type == null || String(e.service_type) === wantSt;
              const sameSeq = e.seq == null || String(e.seq) === String(stopRef.seq);
              return sameDir && sameSt && sameSeq;
            });
            rawEtas.sort((a, b) => (a.eta_seq || 0) - (b.eta_seq || 0));

            let slotsHtml = '';
            for (let i = 0; i < displaySlotCount; i++) {
              slotsHtml += formatEtaSlot(normalizeKmbEta(rawEtas[i]), i);
            }
            stopItem.querySelector('.stop-name').innerText = `${stopRef.seq}. ${stopName}`;
            stopItem.querySelector('.eta-box').innerHTML = slotsHtml;
          } catch (err) {
            console.error('KMB stop/eta error', err);
            stopItem.querySelector('.eta-box').innerHTML = formatEtaSlot(null, 0);
          }
        });
      } catch (err) {
        console.error('KMB route-stop error', err);
      }
    }
  }

  async function getKmbStopName(stopId) {
    if (kmbStopNameCache.has(stopId)) return kmbStopNameCache.get(stopId);
    try {
      const stopData = await fetchJson(`${API.KMB_STOP}${stopId}`);
      const name = stopData.data?.name_tc || '未知車站';
      kmbStopNameCache.set(stopId, name);
      return name;
    } catch {
      return '未知車站';
    }
  }

  function normalizeKmbEta(row) {
    if (!row) return null;
    return {
      eta: row.eta || null,
      remark: row.rmk_tc || row.rmk_en || ''
    };
  }

  async function loadGmbRouteData(routeInfo, isSilentRefresh, token) {
    const resultsContainer = document.getElementById('results');
    const details = await loadGmbRouteDetails(routeInfo.region, routeInfo.route);

    if (!details.length) {
      if (!isSilentRefresh && token === activeRequestToken) {
        resultsContainer.innerHTML = '<div class="loading">未有發現該小巴路線資料（請確認區域與編號）。</div>';
      }
      return;
    }

    if (!isSilentRefresh && token === activeRequestToken) resultsContainer.innerHTML = '';

    for (const variant of details) {
      const directions = variant.directions || [];
      for (const dir of directions) {
        if (token !== activeRequestToken) return;
        const dirKey = `gmb-${variant.route_id}-${dir.route_seq}`;
        const title = `${dir.orig_tc} ➔ ${dir.dest_tc}`;
        const sub = [
          REGION_LABEL[variant.region] || variant.region,
          `route_id ${variant.route_id}`,
          `方向 ${dir.route_seq}`,
          variant.description_tc || '',
          dir.remarks_tc || ''
        ].filter(Boolean).join('　');

        try {
          const data = await fetchJson(`${API.GMB_ROUTE_STOPS}${variant.route_id}/${dir.route_seq}`);
          const stops = data?.data?.route_stops || [];
          if (!stops.length) continue;

          let card = document.getElementById(dirKey);
          if (!card) {
            if (isSilentRefresh) continue;
            card = document.createElement('div');
            card.id = dirKey;
            card.className = 'dir-card';
            card.innerHTML = `<div class="dir-title">${title}<span class="dir-sub">${sub}</span></div><ul class="stop-list"></ul>`;
            resultsContainer.appendChild(card);
          }

          const stopListEl = card.querySelector('.stop-list');
          await mapPool(stops, 6, async (stop) => {
            if (token !== activeRequestToken) return;
            const stopItemId = `gmb-stop-${variant.route_id}-${dir.route_seq}-${stop.stop_seq}`;
            let stopItem = document.getElementById(stopItemId);
            if (!stopItem) {
              stopItem = document.createElement('li');
              stopItem.id = stopItemId;
              stopItem.className = 'stop-item';
              stopItem.innerHTML = `
                <span class="stop-name">${stop.stop_seq}. ${stop.name_tc || '未知車站'}</span>
                <div class="eta-box">載入中...</div>
              `;
              stopListEl.appendChild(stopItem);
            }

            try {
              const etaData = await fetchJson(`${API.GMB_ETA}${variant.route_id}/${dir.route_seq}/${stop.stop_seq}`);
              const rawList = etaData?.data?.eta || [];
              const rawEtas = rawList.map(normalizeGmbEta).filter(Boolean);
              let slotsHtml = '';
              for (let i = 0; i < displaySlotCount; i++) {
                slotsHtml += formatEtaSlot(rawEtas[i] || null, i);
              }
              stopItem.querySelector('.eta-box').innerHTML = slotsHtml;
            } catch {
              let slotsHtml = '';
              for (let i = 0; i < displaySlotCount; i++) slotsHtml += formatEtaSlot(null, i);
              stopItem.querySelector('.eta-box').innerHTML = slotsHtml;
            }
          });
        } catch (e) {
          console.error('GMB route-stop error', e);
        }
      }
    }
  }

  function normalizeGmbEta(e) {
    if (!e) return null;
    return {
      eta: e.timestamp || e.eta || null,
      remark: e.remarks_tc || e.rmk_tc || e.remarks_en || ''
    };
  }

  async function getCtbStopName(stopId) {
    if (ctbStopNameCache.has(stopId)) return ctbStopNameCache.get(stopId);
    try {
      const stopData = await fetchJson(`${API.CTB_STOP}${stopId}`);
      const name = stopData.data?.name_tc || '未知車站';
      ctbStopNameCache.set(stopId, name);
      return name;
    } catch {
      return '未知車站';
    }
  }

    if (!isSilentRefresh && token === activeRequestToken) resultsContainer.innerHTML = '';
    const directions = [
      { path: 'outbound', code: 'O', word: '去程', orig: routeInfo.orig, dest: routeInfo.dest },

        const stops = (data.data || []).slice().sort((a, b) => Number(a.seq) - Number(b.seq));
        if (!stops.length) continue;
        let card = document.getElementById(containerId);
        if (!card) {
          if (isSilentRefresh) continue;
          card = document.createElement('div');
          card.id = containerId;
          card.className = 'dir-card';
          card.innerHTML = `<div class="dir-title">${dir.word}：${dir.orig || '?'} ➔ ${dir.dest || '?'}<span class="dir-sub">城巴 ${routeInfo.route}　dir=${dir.code}　聯營線只顯示城巴班次</span></div><ul class="stop-list"></ul>`;
          resultsContainer.appendChild(card);
        }
        const stopListEl = card.querySelector('.stop-list');
        stops.forEach((stopRef) => {
          const stopItemId = `ctb-stop-${containerId}-${stopRef.seq}-${stopRef.stop}`;
          if (document.getElementById(stopItemId)) return;
          if (isSilentRefresh) return;
          const stopItem = document.createElement('li');
          stopItem.id = stopItemId;
          stopItem.className = 'stop-item';
          stopItem.innerHTML = `<span class="stop-name">${stopRef.seq}. 載入中...</span><div class="eta-box">...</div>`;
          stopListEl.appendChild(stopItem);
        });
        await mapPool(stops, 6, async (stopRef) => {
          if (token !== activeRequestToken) return;
          const stopItemId = `ctb-stop-${containerId}-${stopRef.seq}-${stopRef.stop}`;
          let stopItem = document.getElementById(stopItemId);
          if (!stopItem) return;
          try {
            const stopName = await getCtbStopName(stopRef.stop);
            const etaData = await fetchJson(`${API.CTB_ETA}${stopRef.stop}/${encodeURIComponent(routeInfo.route)}`);
            const rawEtas = (etaData.data || []).filter(e => {
              const sameDir = e.dir === dir.code;
              const sameSeq = e.seq == null || String(e.seq) === String(stopRef.seq);
              return sameDir && sameSeq;
            }).sort((a, b) => (a.eta_seq || 0) - (b.eta_seq || 0));
            let slotsHtml = '';
            for (let i = 0; i < displaySlotCount; i++) {
              slotsHtml += formatEtaSlot(normalizeKmbEta(rawEtas[i]), i);
            }
            stopItem.querySelector('.stop-name').innerText = `${stopRef.seq}. ${stopName}`;
            stopItem.querySelector('.eta-box').innerHTML = slotsHtml;
          } catch (err) {
            console.error('CTB stop/eta error', err);
            stopItem.querySelector('.eta-box').innerHTML = formatEtaSlot(null, 0);
          }
        });
      } catch (err) {
        console.error('CTB route-stop error', err);
      }
    }
  }

  async function loadNlbRouteData(routeInfo, isSilentRefresh, token) {
    const resultsContainer = document.getElementById('results');
    if (!isSilentRefresh && token === activeRequestToken) resultsContainer.innerHTML = '';
    const containerId = `nlb-card-${routeInfo.routeId}`;
    try {
      const data = await fetchJsonPost(API.NLB_STOP_LIST, { routeId: Number(routeInfo.routeId) || routeInfo.routeId });
      const stops = data.stops || [];
      if (!stops.length) {
        if (!isSilentRefresh) resultsContainer.innerHTML = '<div class="loading">未有發現該嶼巴路線車站。</div>';
        return;
      }
      let card = document.getElementById(containerId);
      if (!card) {
        if (isSilentRefresh) return;
        card = document.createElement('div');
        card.id = containerId;
        card.className = 'dir-card';
        card.innerHTML = `<div class="dir-title">${routeInfo.origDest || routeInfo.route}<span class="dir-sub">嶼巴 ${routeInfo.route}　routeId=${routeInfo.routeId}</span></div><ul class="stop-list"></ul>`;
        resultsContainer.appendChild(card);
      }
      const stopListEl = card.querySelector('.stop-list');
      await mapPool(stops, 6, async (stop, idx) => {
        if (token !== activeRequestToken) return;
        const stopItemId = `nlb-stop-${routeInfo.routeId}-${stop.stopId}`;
        let stopItem = document.getElementById(stopItemId);
        if (!stopItem) {
          stopItem = document.createElement('li');
          stopItem.id = stopItemId;
          stopItem.className = 'stop-item';
          stopItem.innerHTML = `<span class="stop-name">${idx + 1}. ${stop.stopName_c || stop.stopName_e}</span><div class="eta-box">載入中...</div>`;
          stopListEl.appendChild(stopItem);
        }
        try {
          const etaData = await fetchJsonPost(API.NLB_ETA, {
            routeId: Number(routeInfo.routeId) || routeInfo.routeId,
            stopId: Number(stop.stopId) || stop.stopId,
            language: 'zh'
          });
          const rawList = etaData.estimatedArrivals || [];
          const rawEtas = rawList.map(e => {
            const t = e.estimatedArrivalTime ? String(e.estimatedArrivalTime).replace(' ', 'T') + '+08:00' : null;
            const scheduled = String(e.noGPS) === '1' || String(e.departed) === '0';
            return {
              eta: t,
              remark: scheduled ? '原定班次' : (etaData.message ? '' : '')
            };
          });
          let slotsHtml = '';
          for (let i = 0; i < displaySlotCount; i++) slotsHtml += formatEtaSlot(rawEtas[i] || null, i);
          stopItem.querySelector('.eta-box').innerHTML = slotsHtml;
        } catch {
          let slotsHtml = '';
          for (let i = 0; i < displaySlotCount; i++) slotsHtml += formatEtaSlot(null, i);
          stopItem.querySelector('.eta-box').innerHTML = slotsHtml;
        }
      });
    } catch (e) {
      console.error('NLB error', e);
      if (!isSilentRefresh) resultsContainer.innerHTML = '<div class="loading">嶼巴資料載入失敗。</div>';
    }
  }

  function parseMtrArrival(bus) {
    if (!bus) return null;
    const text = bus.arrivalTimeText || bus.departureTimeText || '';
    const sec = Number(bus.arrivalTimeInSecond);
    let eta = null;
    if (!Number.isNaN(sec) && sec >= 0 && sec < 864000) {
      eta = new Date(Date.now() + sec * 1000).toISOString();
    }
    const scheduled = String(bus.isScheduled) === '1';
    const remark = [text, scheduled ? '原定班次' : '', bus.busDestination || ''].filter(Boolean).join(' ');
    if (!eta && !remark) return null;
    return { eta, remark };
  }

  async function loadMtrBusRouteData(routeInfo, isSilentRefresh, token) {
    const resultsContainer = document.getElementById('results');
    if (!isSilentRefresh && token === activeRequestToken) resultsContainer.innerHTML = '';
    let schedule = {};
    try {
      schedule = await fetchJsonPost(API.MTR_BUS_ETA, { language: 'zh', routeName: routeInfo.route });
    } catch (e) {
      console.error('MTR bus ETA error', e);
    }
    const statusRemark = schedule.routeStatusRemarkTitle || schedule.routeStatusRemarkContent || '';
    const liveStops = schedule.busStop || [];
    const csvStops = mtrBusStops.filter(s => s.ROUTE_ID === routeInfo.route);
    const dirs = {};
    csvStops.forEach(s => {
      const d = s.DIRECTION || 'O';
      if (!dirs[d]) dirs[d] = [];
      dirs[d].push(s);
    });
    Object.keys(dirs).forEach(d => dirs[d].sort((a, b) => Number(a.STATION_SEQNO) - Number(b.STATION_SEQNO)));

    const dirKeys = Object.keys(dirs).length ? Object.keys(dirs) : ['ALL'];
    for (const d of dirKeys) {
      const containerId = `mtrb-card-${routeInfo.route}-${d}`;
      let card = document.getElementById(containerId);
      if (!card) {
        if (isSilentRefresh) continue;
        const word = d === 'I' ? '回程' : (d === 'O' ? '去程' : '路線');
        card = document.createElement('div');
        card.id = containerId;
        card.className = 'dir-card';
        card.innerHTML = `<div class="dir-title">${word}：${routeInfo.origDest || routeInfo.route}<span class="dir-sub">港鐵巴士 ${routeInfo.route}${statusRemark ? '　' + statusRemark : ''}</span></div><ul class="stop-list"></ul>`;
        resultsContainer.appendChild(card);
      } else if (statusRemark) {
        const sub = card.querySelector('.dir-sub');
        if (sub) sub.textContent = `港鐵巴士 ${routeInfo.route}　${statusRemark}`;
      }
      const stopListEl = card.querySelector('.stop-list');
      const stops = dirs[d] || [];
      if (!stops.length && liveStops.length && d === dirKeys[0]) {
        liveStops.forEach((ls, idx) => {
          const sid = `mtrb-live-${routeInfo.route}-${idx}`;
          let stopItem = document.getElementById(sid);
          if (!stopItem) {
            stopItem = document.createElement('li');
            stopItem.id = sid;
            stopItem.className = 'stop-item';
            stopListEl.appendChild(stopItem);
          }
          const name = ls.busStopName_zh || ls.busStopName_chi || ls.busStopId || `站 ${idx + 1}`;
          const rawEtas = (ls.bus || []).map(parseMtrArrival).filter(Boolean);
          let slotsHtml = '';
          for (let i = 0; i < displaySlotCount; i++) slotsHtml += formatEtaSlot(rawEtas[i] || (statusRemark ? { remark: statusRemark } : null), i);
          stopItem.innerHTML = `<span class="stop-name">${idx + 1}. ${name}</span><div class="eta-box">${slotsHtml}</div>`;
        });
        continue;
      }
      stops.forEach((stop, idx) => {
        const sid = `mtrb-stop-${routeInfo.route}-${d}-${stop.STATION_ID}`;
        let stopItem = document.getElementById(sid);
        if (!stopItem) {
          stopItem = document.createElement('li');
          stopItem.id = sid;
          stopItem.className = 'stop-item';
          stopListEl.appendChild(stopItem);
        }
        const live = liveStops.find(ls =>
          String(ls.busStopId) === String(stop.STATION_ID) ||
          (ls.busStopName_zh && ls.busStopName_zh.includes(stop.STATION_NAME_CHI))
        );
        const rawEtas = (live?.bus || []).map(parseMtrArrival).filter(Boolean);
        let slotsHtml = '';
        for (let i = 0; i < displaySlotCount; i++) {
          slotsHtml += formatEtaSlot(rawEtas[i] || (statusRemark ? { remark: statusRemark } : null), i);
        }
        stopItem.innerHTML = `<span class="stop-name">${stop.STATION_SEQNO || idx + 1}. ${stop.STATION_NAME_CHI}</span><div class="eta-box">${slotsHtml}</div>`;
      });
    }
  }

  function mtrDestName(code) {
    if (!code) return '';
    return mtrStationNameByCode.get(code) || code;
  }

  function parseMtrRailArrival(row) {
    if (!row) return null;
    const destName = mtrDestName(row.dest);
    const plat = row.plat ? `月台 ${row.plat}` : '';
    const scheduled = String(row.source) === '+';
    const remark = [destName, plat, scheduled ? '原定班次' : ''].filter(Boolean).join(' ');
    let eta = null;
    if (row.time) {
      eta = String(row.time).replace(' ', 'T') + '+08:00';
    } else if (row.ttnt != null && row.ttnt !== '') {
      const mins = Number(row.ttnt);
      if (!Number.isNaN(mins)) eta = new Date(Date.now() + mins * 60000).toISOString();
    }
    if (!eta && !remark) return null;
    return { eta, remark };
  }

  async function loadMtrRailRouteData(routeInfo, isSilentRefresh, token) {
    const resultsContainer = document.getElementById('results');
    if (!isSilentRefresh && token === activeRequestToken) resultsContainer.innerHTML = '';
    const dirs = routeInfo.stationsByDir || {};
    const dirKeys = Object.keys(dirs);
    if (!dirKeys.length) {
      if (!isSilentRefresh) resultsContainer.innerHTML = '<div class="loading">未有發現該港鐵綫車站。</div>';
      return;
    }
    for (const d of dirKeys) {
      if (token !== activeRequestToken) return;
      const stops = dirs[d] || [];
      if (!stops.length) continue;
      const first = stops[0];
      const last = stops[stops.length - 1];
      const orig = first['Chinese Name'] || first.CHINESE_NAME || '';
      const dest = last['Chinese Name'] || last.CHINESE_NAME || '';
      const dirWord = MTR_DIR_LABEL[d] || d;
      const containerId = `mtrl-card-${routeInfo.route}-${d}`;
      let card = document.getElementById(containerId);
      if (!card) {
        if (isSilentRefresh) continue;
        card = document.createElement('div');
        card.id = containerId;
        card.className = 'dir-card';
        card.innerHTML = `<div class="dir-title">${dirWord}：${orig} ➔ ${dest}<span class="dir-sub">港鐵 ${MTR_LINE_NAME[routeInfo.route] || routeInfo.route}</span></div><ul class="stop-list"></ul>`;
        resultsContainer.appendChild(card);
      }
      const stopListEl = card.querySelector('.stop-list');
      stops.forEach((stop, idx) => {
        const sta = stop['Station Code'] || stop.STATION_CODE;
        const sid = `mtrl-stop-${routeInfo.route}-${d}-${sta}-${idx}`;
        if (document.getElementById(sid)) return;
        const li = document.createElement('li');
        li.id = sid;
        li.className = 'stop-item';
        const seq = stop.Sequence || stop.SEQUENCE || (idx + 1);
        const name = stop['Chinese Name'] || stop.CHINESE_NAME || sta;
        li.innerHTML = `<span class="stop-name">${Number(seq) || idx + 1}. ${name}（${sta}）</span><div class="eta-box">載入中...</div>`;
        stopListEl.appendChild(li);
      });
      await mapPool(stops, 5, async (stop, idx) => {
        if (token !== activeRequestToken) return;
        const sta = stop['Station Code'] || stop.STATION_CODE;
        const sid = `mtrl-stop-${routeInfo.route}-${d}-${sta}-${idx}`;
        const stopItem = document.getElementById(sid);
        if (!stopItem) return;
        try {
          const data = await fetchJson(`${API.MTR_NEXT_TRAIN}?line=${encodeURIComponent(routeInfo.route)}&sta=${encodeURIComponent(sta)}`);
          const pack = data?.data?.[`${routeInfo.route}-${sta}`] || {};
          const dirKey = d.startsWith('LMC') ? (d.endsWith('UT') ? 'UP' : 'DOWN') : (d === 'UT' ? 'UP' : 'DOWN');
          const rawList = (pack[dirKey] || pack.UP || pack.DOWN || []).slice().sort((a, b) => Number(a.seq) - Number(b.seq));
          const rawEtas = rawList.map(parseMtrRailArrival).filter(Boolean);
          let slotsHtml = '';
          const statusRemark = data && data.status === 0 ? (data.message || '服務資訊異常') : '';
          for (let i = 0; i < displaySlotCount; i++) {
            slotsHtml += formatEtaSlot(rawEtas[i] || (statusRemark ? { remark: statusRemark } : null), i);
          }
          stopItem.querySelector('.eta-box').innerHTML = slotsHtml;
        } catch (e) {
          console.error('MTR rail ETA error', e);
          let slotsHtml = '';
          for (let i = 0; i < displaySlotCount; i++) slotsHtml += formatEtaSlot(null, i);
          stopItem.querySelector('.eta-box').innerHTML = slotsHtml;
        }
      });
    }
  }

  function parseLrtArrival(row) {
    if (!row) return null;
    const dest = row.dest_ch || row.dest_en || '';
    const routeNo = row.route_no ? `${row.route_no}` : '';
    const special = String(row.special) === '1' ? '特別班次' : '';
    const text = row.time_ch || row.time_en || '';
    const remark = [routeNo, dest, special].filter(Boolean).join(' ');
    let eta = null;
    if (text && /^\d+$/.test(String(text).trim())) {
      eta = new Date(Date.now() + Number(text) * 60000).toISOString();
    } else if (text && (text.includes('分鐘') || text.includes('min'))) {
      const n = parseInt(text, 10);
      if (!Number.isNaN(n)) eta = new Date(Date.now() + n * 60000).toISOString();
    } else if (text && (text.includes('即將') || text === '-' || text.toLowerCase() === 'arriving')) {
      eta = new Date().toISOString();
    }
    if (!eta && !remark && !text) return null;
    return { eta, remark: remark || text };
  }

  async function loadLrtRouteData(routeInfo, isSilentRefresh, token) {
    const resultsContainer = document.getElementById('results');
    if (!isSilentRefresh && token === activeRequestToken) resultsContainer.innerHTML = '';
    const dirs = routeInfo.stopsByDir || {};
    const dirKeys = Object.keys(dirs);
    if (!dirKeys.length) {
      if (!isSilentRefresh) resultsContainer.innerHTML = '<div class="loading">未有發現該輕鐵路線車站。</div>';
      return;
    }
    for (const d of dirKeys) {
      if (token !== activeRequestToken) return;
      const stops = dirs[d] || [];
      if (!stops.length) continue;
      const orig = stops[0]['Chinese Name'] || stops[0].CHINESE_NAME || '';
      const dest = stops[stops.length - 1]['Chinese Name'] || stops[stops.length - 1].CHINESE_NAME || '';
      const containerId = `lrt-card-${routeInfo.route}-${d}`;
      let card = document.getElementById(containerId);
      if (!card) {
        if (isSilentRefresh) continue;
        card = document.createElement('div');
        card.id = containerId;
        card.className = 'dir-card';
        card.innerHTML = `<div class="dir-title">${d === '1' ? '去程' : '回程'}：${orig} ➔ ${dest}<span class="dir-sub">輕鐵 ${routeInfo.route}</span></div><ul class="stop-list"></ul>`;
        resultsContainer.appendChild(card);
      }
      const stopListEl = card.querySelector('.stop-list');
      stops.forEach((stop, idx) => {
        const stopId = stop['Stop ID'] || stop.STOP_ID;
        const sid = `lrt-stop-${routeInfo.route}-${d}-${stopId}-${idx}`;
        if (document.getElementById(sid)) return;
        const li = document.createElement('li');
        li.id = sid;
        li.className = 'stop-item';
        const seq = stop.Sequence || stop.SEQUENCE || (idx + 1);
        const name = stop['Chinese Name'] || stop.CHINESE_NAME || stopId;
        li.innerHTML = `<span class="stop-name">${Number(seq) || idx + 1}. ${name}</span><div class="eta-box">載入中...</div>`;
        stopListEl.appendChild(li);
      });
      await mapPool(stops, 5, async (stop, idx) => {
        if (token !== activeRequestToken) return;
        const stopId = stop['Stop ID'] || stop.STOP_ID;
        const sid = `lrt-stop-${routeInfo.route}-${d}-${stopId}-${idx}`;
        const stopItem = document.getElementById(sid);
        if (!stopItem) return;
        try {
          const data = await fetchJson(`${API.LRT_NEXT_TRAIN}?station_id=${encodeURIComponent(stopId)}&with_special=1`);
          const wantRoute = String(routeInfo.route);
          const trains = [];
          (data.platform_list || []).forEach(p => {
            (p.route_list || []).forEach(r => {
              if (String(r.route_no) === wantRoute) trains.push(r);
            });
          });
          const rawEtas = trains.map(parseLrtArrival).filter(Boolean);
          let slotsHtml = '';
          const nightOff = data.status === 2 && !rawEtas.length;
          for (let i = 0; i < displaySlotCount; i++) {
            slotsHtml += formatEtaSlot(rawEtas[i] || (nightOff ? { remark: '現時沒有班次' } : null), i);
          }
          stopItem.querySelector('.eta-box').innerHTML = slotsHtml;
        } catch (e) {
          console.error('LRT ETA error', e);
          let slotsHtml = '';
          for (let i = 0; i < displaySlotCount; i++) slotsHtml += formatEtaSlot(null, i);
          stopItem.querySelector('.eta-box').innerHTML = slotsHtml;
        }
      });
    }
  }

  function formatEtaSlot(etaObj, index) {
    const labels = ['下一班', '第二班', '第三班'];
    const slotLabel = labels[index] || `第${index + 1}班`;

    if (!etaObj || (!etaObj.eta && !etaObj.remark)) {
      return slotHtml(slotLabel, '沒有班次', 'eta-empty');
    }

    const remark = etaObj.remark || '';
    const isScheduled = remark.includes('原定班次');

    if (etaObj.eta) {
      const diffMs = new Date(etaObj.eta) - new Date();
      if (Number.isNaN(diffMs)) {
        return slotHtml(slotLabel, remark || '時間格式異常', 'eta-empty');
      }
      const diffMins = Math.round(diffMs / 60000);
      if (diffMins <= 0) {
        return slotHtml(slotLabel, '0 分（即將抵達）', 'eta-now');
      }
      if (isScheduled) {
        return slotHtml(slotLabel, `${diffMins} 分（原定）`, 'eta-scheduled');
      }
      const extra = remark && !isScheduled ? `｜${remark}` : '';
      return slotHtml(slotLabel, `${diffMins} 分（實時）${extra}`, 'eta-realtime');
    }

    return slotHtml(slotLabel, remark, isScheduled ? 'eta-scheduled' : 'eta-empty');
  }

  function slotHtml(label, value, cls) {
    return `
      <div class="eta-slot ${cls}">
        <span class="eta-label">${label}</span>
        <span class="eta-value">${value}</span>
      </div>`;
  }

  function handleSlotCountChange(val) {
    displaySlotCount = parseInt(val, 10);
    if (selectedRoute) fetchAndDisplayETA(selectedRoute, true);
  }

  function manualRefresh() {
    if (!selectedRoute) return;
    const btn = document.getElementById('manualRefreshBtn');
    btn.disabled = true;
    btn.innerText = '⏳ 刷新中...';
    fetchAndDisplayETA(selectedRoute, true).finally(() => {
      resetAutoRefresh();
      setTimeout(() => {
        btn.disabled = false;
        btn.innerText = '🔄 手動刷新';
      }, 500);
    });
  }
</script>
