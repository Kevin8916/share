<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港巴士與小巴實時 ETA 查詢平台 (v14.5.5)</title>
  <style>
    :root {
      --primary-color: #0056b3;
      --bg-color: #f4f7f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e0e0e0;
      --accent-kmb: #e60012;
      --accent-ctb: #f5a623;
      --accent-nlb: #2c6e49;
      --accent-mtr: #00706a;
      --accent-gmb: #27ae60;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 850px;
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      font-size: 1.6rem;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    h1 .app-version {
      font-size: 0.5em;
      font-weight: 600;
      vertical-align: middle;
      margin-left: 0.2em;
    }

    .search-box {
      position: relative;
      margin-bottom: 12px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 1.1rem;
      border: 2px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary-color);
    }

    .status-hint {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 16px;
      padding-left: 4px;
    }

    .autocomplete-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid #ddd;
      border-radius: 0 0 8px 8px;
      max-height: 480px;
      overflow-y: auto;
      z-index: 1000;
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    }

    .autocomplete-item {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .autocomplete-item:hover {
      background-color: #eef5ff;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      color: white;
      white-space: nowrap;
    }

    .badge-kmb { background-color: var(--accent-kmb); }
    .badge-ctb { background-color: var(--accent-ctb); color: #222; }
    .badge-nlb { background-color: var(--accent-nlb); }
    .badge-mtr { background-color: var(--accent-mtr); }
    .badge-gmb { background-color: var(--accent-gmb); }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #e8f4fd;
      border: 1px solid #b6e0fe;
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      color: #004085;
      flex-wrap: wrap;
      gap: 10px;
    }

    .timer-badge {
      background: #0056b3;
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: bold;
      min-width: 2.2em;
      text-align: center;
      display: inline-block;
      font-variant-numeric: tabular-nums;
    }

    .direction-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .dir-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid var(--border-color);
    }

    .dir-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--primary-color);
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 8px;
      margin-bottom: 14px;
    }

    .dir-sub {
      display: block;
      font-size: 0.8rem;
      font-weight: normal;
      color: #666;
      margin-top: 4px;
    }

    .stop-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .stop-item {
      padding: 12px 0;
      border-bottom: 1px dashed #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
    }

    .stop-name {
      font-weight: 500;
      font-size: 1rem;
      color: #222;
      align-self: flex-start;
      max-width: 100%;
    }

    .eta-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      align-self: flex-end;
      width: 100%;
    }

    .eta-slot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.88rem;
      border: 1px solid #ddd;
      background: #ffffff;
    }

    .eta-slot .eta-label {
      font-weight: bold;
      color: #555;
      padding-right: 4px;
      border-right: 1px solid rgba(0,0,0,0.15);
    }

    .eta-slot .eta-value { font-weight: bold; }

    .eta-slot.eta-realtime { background: #e1f5fe; border-color: #81d4fa; }
    .eta-slot.eta-realtime .eta-value { color: #0288d1; }

    .eta-slot.eta-now { background: #e8f5e9; border-color: #a5d6a7; }
    .eta-slot.eta-now .eta-value { color: #2e7d32; }

    .eta-slot.eta-scheduled { background: #fff3e0; border-color: #ffe0b2; }
    .eta-slot.eta-scheduled .eta-value { color: #e65100; }

    .eta-slot.eta-empty { background: #f5f5f5; border-color: #e0e0e0; }
    .eta-slot.eta-empty .eta-value { color: #9e9e9e; }

    .loading {
      text-align: center;
      color: #666;
      font-style: italic;
      padding: 30px;
      background: white;
      border-radius: 8px;
      border: 1px dashed #ccc;
    }

    .status-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 12px;
    }

    .status-controls label {
      font-size: 0.88rem;
      font-weight: bold;
      color: #004085;
    }

    .control-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .slot-select {
      padding: 4px 8px;
      font-size: 0.88rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      background-color: #fff;
      font-weight: bold;
      color: #333;
      cursor: pointer;
    }

    #floatRefreshBtn {
      display: none;
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      right: max(16px, env(safe-area-inset-right));
      z-index: 1100;
      background: #0295FF;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 149, 255, 0.22);
      opacity: 0.5;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: background-color 0.2s, transform 0.1s, opacity 0.2s, box-shadow 0.2s;
    }

    #floatRefreshBtn.is-opaque,
    #floatRefreshBtn:active {
      background-color: #007FE0;
      opacity: 1;
      box-shadow: 0 4px 12px rgba(2, 149, 255, 0.38);
    }
    #floatRefreshBtn:active { transform: scale(0.96); }

    @media (hover: hover) and (pointer: fine) {
      #floatRefreshBtn:hover,
      #floatRefreshBtn:focus-visible {
        background-color: #007FE0;
        opacity: 1;
        box-shadow: 0 4px 12px rgba(2, 149, 255, 0.38);
      }
    }

    #floatRefreshBtn:disabled {
      cursor: not-allowed;
      transform: none;
    }
    #floatRefreshBtn:disabled:not(.is-opaque) {
      opacity: 0.4;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🚍 香港巴士 / 小巴 ETA 實時到站查詢 <span class="app-version">(v14.5.5)</span></h1>

  <div class="search-box">
    <input type="text" id="routeInput" placeholder="輸入路線編號 (例: 5B, 116, 140M, 1, K12)..." autocomplete="off">
    <div id="autocompleteList" class="autocomplete-list" style="display:none;"></div>
  </div>
  <div id="initStatus" class="status-hint">⏳ 正在載入九巴/龍運、城巴、嶼巴、港鐵巴士及綠色小巴路線資料...</div>

  <div id="statusBar" class="status-bar" style="display:none;">
    <span>正在檢視路線：<strong id="activeRouteName">--</strong></span>
    <div class="status-controls">
      <div class="control-group">
        <label for="slotCountSelect">班次</label>
        <select id="slotCountSelect" class="slot-select" onchange="handleSlotCountChange(this.value)">
          <option value="1">1 班</option>
          <option value="2" selected>2 班</option>
          <option value="3">3 班</option>
        </select>
      </div>
      <div class="control-group">
        <label for="refreshIntervalSelect">自動更新</label>
        <select id="refreshIntervalSelect" class="slot-select" onchange="handleRefreshIntervalChange(this.value)">
          <option value="10">10 秒</option>
          <option value="12" selected>12 秒</option>
          <option value="15">15 秒</option>
        </select>
      </div>
      <span id="countdownTimer" class="timer-badge" title="距離下次自動更新">12</span> 秒
    </div>
  </div>

  <div id="results" class="direction-container"></div>
</div>

<button type="button" id="floatRefreshBtn" onpointerdown="pulseFloatRefreshOpaque()" onclick="manualRefresh()" aria-label="手動刷新到站時間" title="手動刷新到站時間">刷新[12]</button>

<script>
  const API = {
    KMB_ROUTES: 'https://data.etabus.gov.hk/v1/transport/kmb/route/',
    KMB_ROUTE_STOPS: 'https://data.etabus.gov.hk/v1/transport/kmb/route-stop/',
    KMB_STOP: 'https://data.etabus.gov.hk/v1/transport/kmb/stop/',
    KMB_ETA: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/',
    GMB_ROUTES: 'https://data.etagmb.gov.hk/route',
    GMB_ROUTE_STOPS: 'https://data.etagmb.gov.hk/route-stop/',
    GMB_ETA: 'https://data.etagmb.gov.hk/eta/route-stop/',
    CTB_ROUTES: 'https://rt.data.gov.hk/v2/transport/citybus/route/CTB',
    CTB_ROUTE_STOPS: 'https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/',
    CTB_STOP: 'https://rt.data.gov.hk/v2/transport/citybus/stop/',
    CTB_ETA: 'https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/',
    NLB_ROUTE_LIST: 'https://rt.data.gov.hk/v2/transport/nlb/route.php?action=list',
    NLB_STOP_LIST: 'https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=list',
    NLB_ETA: 'https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=estimatedArrivals',
    MTR_BUS_ETA: 'https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule'
  };

  const TYPE_ORDER = { KMB: 0, CTB: 1, NLB: 2, MTRB: 3, GMB: 4 };
  const BADGE_CLASS = { KMB: 'badge-kmb', CTB: 'badge-ctb', NLB: 'badge-nlb', MTRB: 'badge-mtr', GMB: 'badge-gmb' };

  const REGION_LABEL = { HKI: '港島', KLN: '九龍', NT: '新界' };

  // 港鐵巴士線網短、CSV 在 opendata.mtr.com.hk 無 CORS；用官方規格名單作搜尋索引，站名改由 getSchedule 回傳。
  const MTR_BUS_ROUTE_SEED = [
    { route: '506', origDest: '屯門碼頭 ↔ 兆麟／富健花園 ↔ 屯門站' },
    { route: 'K12', origDest: '大埔墟站 ↔ 八號花園' },
    { route: 'K14', origDest: '大埔超級城 ↔ 大埔墟站' },
    { route: 'K17', origDest: '大埔墟站 ↔ 富善' },
    { route: 'K18', origDest: '大埔墟站 ↔ 廣福' },
    { route: 'K51', origDest: '富泰 ↔ 大欖／兆康站' },
    { route: 'K51A', origDest: '富泰 ↔ 掃管笏' },
    { route: 'K52', origDest: '悅湖山莊 ↔ 龍鼓灘' },
    { route: 'K52A', origDest: '屯門站 ↔ 曾咀' },
    { route: 'K52P', origDest: '龍鼓灘 ↔ 屯門站' },
    { route: 'K53', origDest: '屯門站 ↔ 掃管笏（循環）' },
    { route: 'K53S', origDest: '屯門站 ↔ 業旺邨（循環）' },
    { route: 'K54', origDest: '和田邨 ↔ 屯門市中心（循環）' },
    { route: 'K54A', origDest: '和田邨 ↔ 兆康站' },
    { route: 'K58', origDest: '富泰 ↔ 掃管笏' },
    { route: 'K65', origDest: '元朗站 ↔ 流浮山' },
    { route: 'K65A', origDest: '天水圍站 ↔ 流浮山' },
    { route: 'K66', origDest: '朗屏 ↔ 大棠黃泥墩村' },
    { route: 'K68', origDest: '元朗工業邨 ↔ 元朗公園（循環）' },
    { route: 'K73', origDest: '天恆 ↔ 元朗西' },
    { route: 'K74', origDest: '天水圍市中心 ↔ 凹頭（循環）' },
    { route: 'K75A', origDest: '天水圍站 ↔ 洪水橋（循環）' },
    { route: 'K75P', origDest: '天瑞 ↔ 洪水橋（循環）' },
    { route: 'K76', origDest: '天恆 ↔ 天水圍站' }
  ];

  let rawKmbRoutes = [];
  let searchIndex = [];
  let selectedRoute = null;
  let refreshTimer = null;
  let countdownTimer = null;
  let refreshIntervalSec = 12;
  let secondsRemaining = refreshIntervalSec;
  let isManualRefreshing = false;
  let floatOpaqueTimer = null;
  let isRoutesLoaded = false;
  let displaySlotCount = 2;
  const gmbDetailCache = new Map();
  const kmbStopNameCache = new Map();
  const ctbStopNameCache = new Map();
  let rawNlbRoutes = [];
  let mtrBusStops = [];
  let activeRequestToken = 0;

  async function fetchJson(url) {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status} ${url}`);
    return res.json();
  }

  async function fetchJsonPost(url, body) {
    const res = await fetch(url, {
      method: 'POST',
      cache: 'no-store',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
    if (!res.ok) throw new Error(`HTTP ${res.status} ${url}`);
    return res.json();
  }

  function parseCsv(text) {
    const rows = [];
    const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/).filter(Boolean);
    if (!lines.length) return rows;
    const headers = lines[0].split(',').map(h => h.trim());
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(',');
      const obj = {};
      headers.forEach((h, idx) => { obj[h] = (cols[idx] || '').trim(); });
      rows.push(obj);
    }
    return rows;
  }

  async function mapPool(items, limit, worker) {
    const results = new Array(items.length);
    let cursor = 0;
    async function run() {
      while (cursor < items.length) {
        const i = cursor++;
        results[i] = await worker(items[i], i);
      }
    }
    const n = Math.min(limit, items.length);
    await Promise.all(Array.from({ length: n }, run));
    return results;
  }

  function uniqueKey(item) {
    if (item.type === 'KMB') return `KMB:${item.route}`;
    return `GMB:${item.region}:${item.route}`;
  }

  async function initRoutes() {
    const statusHint = document.getElementById('initStatus');
    const regions = ['HKI', 'KLN', 'NT'];

    const kmbTask = fetchJson(API.KMB_ROUTES)
      .then(data => data.data || [])
      .catch(e => {
        console.error('九巴資料載入失敗', e);
        return [];
      });

    const ctbTask = fetchJson(API.CTB_ROUTES)
      .then(data => (data.data || []).map(r => ({
        type: 'CTB',
        company: '城巴',
        route: r.route,
        orig: r.orig_tc,
        dest: r.dest_tc
      })))
      .catch(e => {
        console.error('城巴資料載入失敗', e);
        return [];
      });

    const nlbTask = fetchJson(API.NLB_ROUTE_LIST)
      .then(data => {
        rawNlbRoutes = data.routes || [];
        return rawNlbRoutes.map(r => ({
          type: 'NLB',
          company: '嶼巴',
          route: String(r.routeNo),
          routeId: r.routeId,
          origDest: r.routeName_c || r.routeName_e,
          overnight: r.overnightRoute,
          special: r.specialRoute
        }));
      })
      .catch(e => {
        console.error('嶼巴資料載入失敗', e);
        return [];
      });

    const mtrTask = Promise.resolve(
      MTR_BUS_ROUTE_SEED.map(r => ({
        type: 'MTRB',
        company: '港鐵巴士',
        route: r.route,
        origDest: r.origDest,
        circular: /循環/.test(r.origDest)
      }))
    );

    const gmbTasks = regions.map(region =>
      fetchJson(`${API.GMB_ROUTES}/${region}`)
        .then(data => {
          const codes = data?.data?.routes;
          if (!Array.isArray(codes)) return [];
          return codes.map(code => ({
            type: 'GMB',
            company: '綠色小巴',
            region,
            route: String(code),
            description: ''
          }));
        })
        .catch(e => {
          console.warn(`綠色小巴 (${region}) 載入失敗`, e);
          return [];
        })
    );

    try {
      const [kmbData, ctbRoutes, nlbRoutes, mtrRoutes, ...gmbRegionResults] = await Promise.all([
        kmbTask, ctbTask, nlbTask, mtrTask, ...gmbTasks
      ]);
      rawKmbRoutes = kmbData;
      const gmbRoutes = gmbRegionResults.flat();

      const kmbGrouped = {};
      rawKmbRoutes.forEach(r => {
        if (!kmbGrouped[r.route]) kmbGrouped[r.route] = [];
        kmbGrouped[r.route].push(r);
      });

      const kmbUniqueList = Object.entries(kmbGrouped).map(([route, variants]) => {
        const main = variants.find(v => String(v.service_type) === '1' && v.bound === 'O')
          || variants.find(v => String(v.service_type) === '1')
          || variants[0];
        return {
          type: 'KMB',
          company: '九巴/龍運',
          route,
          orig: main.orig_tc,
          dest: main.dest_tc,
          variants
        };
      });

      searchIndex = [...kmbUniqueList, ...ctbRoutes, ...nlbRoutes, ...mtrRoutes, ...gmbRoutes];
      isRoutesLoaded = true;
      statusHint.innerHTML = `✅ 資料載入完成！九巴/龍運 <strong>${kmbUniqueList.length}</strong>、城巴 <strong>${ctbRoutes.length}</strong>、嶼巴 <strong>${nlbRoutes.length}</strong>、港鐵巴士 <strong>${mtrRoutes.length}</strong>、綠色小巴編號 <strong>${gmbRoutes.length}</strong>。選線後才抓車站與 ETA。`;
      statusHint.style.color = '#27ae60';
      handleSearch();
    } catch (e) {
      console.error('路線資料初始化失敗', e);
      statusHint.innerHTML = '⚠️ 路線資料初始化失敗，請檢查網路連線或重新整理網頁。';
      statusHint.style.color = '#e60012';
    }
  }

  initRoutes();

  const routeInput = document.getElementById('routeInput');
  const autocompleteList = document.getElementById('autocompleteList');

  function sortMatches(filtered, query) {
    return filtered.sort((a, b) => {
      const routeA = a.route.toUpperCase();
      const routeB = b.route.toUpperCase();
      const exactA = routeA === query;
      const exactB = routeB === query;
      if (exactA && !exactB) return -1;
      if (!exactA && exactB) return 1;
      const startsA = routeA.startsWith(query);
      const startsB = routeB.startsWith(query);
      if (startsA && !startsB) return -1;
      if (!startsA && startsB) return 1;
      if (a.type !== b.type) return (TYPE_ORDER[a.type] ?? 9) - (TYPE_ORDER[b.type] ?? 9);
      if (routeA.length !== routeB.length) return routeA.length - routeB.length;
      if (a.type === 'NLB') {
        return String(a.routeId).localeCompare(String(b.routeId), undefined, { numeric: true });
      }
      if (a.type === 'GMB') {
        if (a.region !== b.region) return String(a.region).localeCompare(String(b.region));
        return String(a.gmbRouteId || '').localeCompare(String(b.gmbRouteId || ''), undefined, { numeric: true });
      }
      return routeA.localeCompare(routeB);
    });
  }

  function routeLabel(item) {
    if (item.type === 'KMB' || item.type === 'CTB') {
      return `${item.route}（${item.orig || '?'} ↔ ${item.dest || '?'}）`;
    }
    if (item.type === 'NLB') {
      return `${item.route}（${item.origDest || '嶼巴'}）`;
    }
    if (item.type === 'MTRB') {
      return `${item.route}（${item.origDest || '港鐵巴士'}）`;
    }
    const region = REGION_LABEL[item.region] || item.region;
    if (item.detailSummary) return `${item.route} · ${region}（${item.detailSummary}）`;
    return `${item.route} · ${region}專線小巴`;
  }

  function renderAutocomplete(filtered) {
    autocompleteList.innerHTML = '';
    if (!filtered.length) {
      autocompleteList.style.display = 'none';
      return;
    }
    filtered.slice(0, 80).forEach(item => {
      const div = document.createElement('div');
      div.className = 'autocomplete-item';
      const badgeClass = BADGE_CLASS[item.type] || 'badge-kmb';
      div.innerHTML = `
        <span><strong>${item.route}</strong> <small style="color:#666; margin-left:8px;">${routeLabel(item)}</small></span>
        <span class="badge ${badgeClass}">${item.company}</span>
      `;
      div.addEventListener('click', () => {
        routeInput.value = item.route;
        autocompleteList.style.display = 'none';
        selectRoute(item);
      });
      autocompleteList.appendChild(div);
    });
    autocompleteList.style.display = 'block';
  }

  function expandGmbByRouteId(baseItem, details) {
    if (!details?.length) {
      return [{ ...baseItem, detailSummary: baseItem.detailSummary || '' }];
    }
    return details.map((d) => {
      const dir = d.directions?.[0];
      const summary = dir
        ? `${dir.orig_tc || '?'} ↔ ${dir.dest_tc || '?'}`
        : (d.description_tc || '');
      return {
        ...baseItem,
        gmbRouteId: d.route_id,
        description: d.description_tc || '',
        detailSummary: [summary, d.description_tc].filter(Boolean).filter((v, i, arr) => arr.indexOf(v) === i).join('　')
      };
    });
  }

  async function enrichGmbMatches(matches) {
    const targets = matches.filter(m => m.type === 'GMB' && m.gmbRouteId == null).slice(0, 12);
    await mapPool(targets, 4, async (item) => {
      try {
        const details = await loadGmbRouteDetails(item.region, item.route);
        const expanded = expandGmbByRouteId(item, details);
        const idx = searchIndex.findIndex(r =>
          r.type === 'GMB' && r.region === item.region && r.route === item.route && r.gmbRouteId == null
        );
        if (idx >= 0) searchIndex.splice(idx, 1, ...expanded);
        else expanded.forEach(row => {
          if (!searchIndex.some(r => r.type === 'GMB' && r.region === row.region && r.route === row.route && r.gmbRouteId === row.gmbRouteId)) {
            searchIndex.push(row);
          }
        });
      } catch (e) {
        console.warn('GMB 詳情預載失敗', item, e);
      }
    });
  }

  function summarizeGmbDetails(details) {
    if (!details?.length) return '';
    const first = details[0];
    const dir = first.directions?.[0];
    const extra = details.length > 1 ? ` 等 ${details.length} 個班次類型` : '';
    if (!dir) return first.description_tc || '';
    return `${dir.orig_tc} ↔ ${dir.dest_tc}${extra}`;
  }

  async function handleSearch() {
    const query = routeInput.value.trim().toUpperCase();
    if (!query || !isRoutesLoaded) {
      autocompleteList.style.display = 'none';
      return;
    }
    const matchQuery = (q) => sortMatches(
      searchIndex.filter(r => r.route.toUpperCase().includes(q)),
      q
    );
    let filtered = matchQuery(query);
    renderAutocomplete(filtered);
    if (filtered.some(x => x.type === 'GMB' && x.gmbRouteId == null)) {
      await enrichGmbMatches(filtered);
      if (routeInput.value.trim().toUpperCase() !== query) return;
      filtered = matchQuery(query);
      renderAutocomplete(filtered);
    }
  }

  routeInput.addEventListener('input', handleSearch);

  document.addEventListener('click', (e) => {
    if (!routeInput.contains(e.target) && !autocompleteList.contains(e.target)) {
      autocompleteList.style.display = 'none';
    }
  });

  async function loadGmbRouteDetails(region, route) {
    const key = `${region}:${route}`;
    if (gmbDetailCache.has(key)) return gmbDetailCache.get(key);
    const data = await fetchJson(`${API.GMB_ROUTES}/${region}/${encodeURIComponent(route)}`);
    const details = Array.isArray(data.data) ? data.data : [];
    gmbDetailCache.set(key, details);
    return details;
  }

  function selectRoute(routeItem) {
    selectedRoute = routeItem;
    const statusBar = document.getElementById('statusBar');
    const activeRouteName = document.getElementById('activeRouteName');
    statusBar.style.display = 'flex';
    let extra = '';
    if (routeItem.type === 'GMB') {
      extra = `（${REGION_LABEL[routeItem.region] || routeItem.region}${routeItem.detailSummary ? '　' + routeItem.detailSummary : ''}）`;
    }
    if (routeItem.type === 'NLB' && routeItem.origDest) extra = `（${routeItem.origDest}）`;
    if (routeItem.type === 'MTRB' && routeItem.origDest) extra = `（${routeItem.origDest}）`;
    activeRouteName.innerText = `${routeItem.company} - ${routeItem.route}${extra}`;
    const floatBtn = document.getElementById('floatRefreshBtn');
    if (floatBtn) floatBtn.style.display = 'inline-flex';
    fetchAndDisplayETA(selectedRoute);
    resetAutoRefresh();
  }

  function formatCountdown(sec) {
    return String(sec).padStart(2, '0');
  }

  function setCountdownDisplay(sec) {
    const formatted = formatCountdown(sec);
    const el = document.getElementById('countdownTimer');
    if (el) el.innerText = formatted;
    const floatBtn = document.getElementById('floatRefreshBtn');
    if (floatBtn) floatBtn.innerText = `刷新[${formatted}]`;
  }

  function resetAutoRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);
    if (countdownTimer) clearInterval(countdownTimer);
    secondsRemaining = refreshIntervalSec;
    setCountdownDisplay(secondsRemaining);

    countdownTimer = setInterval(() => {
      secondsRemaining--;
      if (secondsRemaining <= 0) secondsRemaining = refreshIntervalSec;
      setCountdownDisplay(secondsRemaining);
    }, 1000);

    refreshTimer = setInterval(() => {
      if (selectedRoute) fetchAndDisplayETA(selectedRoute, true);
    }, refreshIntervalSec * 1000);
  }

  async function fetchAndDisplayETA(routeInfo, isSilentRefresh = false) {
    const token = ++activeRequestToken;
    const resultsContainer = document.getElementById('results');
    if (!isSilentRefresh) {
      resultsContainer.innerHTML = '<div class="loading">正在實時查詢車站及到站時間 (ETA)...</div>';
    }
    try {
      if (routeInfo.type === 'KMB') {
        await loadKmbRouteData(routeInfo, isSilentRefresh, token);
      } else if (routeInfo.type === 'GMB') {
        await loadGmbRouteData(routeInfo, isSilentRefresh, token);
      } else if (routeInfo.type === 'CTB') {
        await loadCtbRouteData(routeInfo, isSilentRefresh, token);
      } else if (routeInfo.type === 'NLB') {
        await loadNlbRouteData(routeInfo, isSilentRefresh, token);
      } else if (routeInfo.type === 'MTRB') {
        await loadMtrBusRouteData(routeInfo, isSilentRefresh, token);
      }
    } catch (e) {
      console.error(e);
      if (!isSilentRefresh && token === activeRequestToken) {
        resultsContainer.innerHTML = '<div class="loading">資料載入失敗，請稍後再試。</div>';
      }
    }
  }

  function kmbDirPath(bound) {
    return bound === 'I' ? 'inbound' : 'outbound';
  }

  function kmbDirCode(pathOrBound) {
    if (pathOrBound === 'inbound' || pathOrBound === 'I') return 'I';
    return 'O';
  }

  async function loadKmbRouteData(routeInfo, isSilentRefresh, token) {
    const resultsContainer = document.getElementById('results');
    const variants = rawKmbRoutes.filter(r => r.route === routeInfo.route);
    const jobs = variants.map(variant => ({
      route: variant.route,
      bound: variant.bound,
      serviceType: String(variant.service_type),
      orig: variant.orig_tc,
      dest: variant.dest_tc
    })).sort((a, b) => {
      const specialA = a.serviceType === '1' ? 0 : 1;
      const specialB = b.serviceType === '1' ? 0 : 1;
      if (specialA !== specialB) return specialA - specialB;
      const boundA = a.bound === 'I' ? 1 : 0;
      const boundB = b.bound === 'I' ? 1 : 0;
      if (boundA !== boundB) return boundA - boundB;
      return a.serviceType.localeCompare(b.serviceType, undefined, { numeric: true });
    });

    if (!isSilentRefresh && token === activeRequestToken) resultsContainer.innerHTML = '';

    for (const job of jobs) {
      if (token !== activeRequestToken) return;
      const dirPath = kmbDirPath(job.bound);
      const containerId = `kmb-card-${job.route}-${dirPath}-${job.serviceType}`;
      const isSpecial = job.serviceType !== '1';
      const specialSuffix = isSpecial ? '[特別班次]' : '';
      const dirWord = job.bound === 'I' ? '回程' : '去程';

      try {
        const data = await fetchJson(`${API.KMB_ROUTE_STOPS}${job.route}/${dirPath}/${job.serviceType}`);
        const stops = (data.data || []).slice().sort((a, b) => Number(a.seq) - Number(b.seq));
        if (!stops.length) continue;

        let card = document.getElementById(containerId);
        if (!card) {
          card = document.createElement('div');
          card.id = containerId;
          card.className = 'dir-card';
          card.innerHTML = `<div class="dir-title">${dirWord}：${job.orig} ➔ ${job.dest}${specialSuffix}<span class="dir-sub">九巴/龍運 ${job.route}</span></div><ul class="stop-list"></ul>`;
          resultsContainer.appendChild(card);
        }

        const stopListEl = card.querySelector('.stop-list');
        stops.forEach((stopRef) => {
          const stopItemId = `kmb-stop-${containerId}-${stopRef.seq}-${stopRef.stop}`;
          if (document.getElementById(stopItemId)) return;
          const stopItem = document.createElement('li');
          stopItem.id = stopItemId;
          stopItem.className = 'stop-item';
          stopItem.innerHTML = `<span class="stop-name">${stopRef.seq}. 載入中...</span><div class="eta-box">...</div>`;
          stopListEl.appendChild(stopItem);
        });
        await mapPool(stops, 6, async (stopRef) => {
          if (token !== activeRequestToken) return;
          const stopItemId = `kmb-stop-${containerId}-${stopRef.seq}-${stopRef.stop}`;
          let stopItem = document.getElementById(stopItemId);
          if (!stopItem) return;

          try {
            const stopName = await getKmbStopName(stopRef.stop);
            const etaData = await fetchJson(`${API.KMB_ETA}${stopRef.stop}/${job.route}/${job.serviceType}`);
            const wantDir = kmbDirCode(job.bound);
            const wantSt = String(job.serviceType);
            const rawEtas = (etaData.data || []).filter(e => {
              const sameDir = e.dir === wantDir;
              const sameSt = e.service_type == null || String(e.service_type) === wantSt;
              const sameSeq = e.seq == null || String(e.seq) === String(stopRef.seq);
              return sameDir && sameSt && sameSeq;
            });
            rawEtas.sort((a, b) => (a.eta_seq || 0) - (b.eta_seq || 0));

            stopItem.querySelector('.stop-name').innerText = `${stopRef.seq}. ${stopName}`;
            stopItem.querySelector('.eta-box').innerHTML = renderEtaSlots(rawEtas.map(normalizeKmbEta));
          } catch (err) {
            console.error('KMB stop/eta error', err);
            stopItem.querySelector('.eta-box').innerHTML = renderEtaSlots([], { error: true });
          }
        });
      } catch (err) {
        console.error('KMB route-stop error', err);
      }
    }
  }

  async function getKmbStopName(stopId) {
    if (kmbStopNameCache.has(stopId)) return kmbStopNameCache.get(stopId);
    try {
      const stopData = await fetchJson(`${API.KMB_STOP}${stopId}`);
      const name = stopData.data?.name_tc || '未知車站';
      kmbStopNameCache.set(stopId, name);
      return name;
    } catch {
      return '未知車站';
    }
  }

  function normalizeKmbEta(row) {
    if (!row) return null;
    return {
      eta: row.eta || null,
      remark: row.rmk_tc || row.rmk_en || ''
    };
  }

  async function loadGmbRouteData(routeInfo, isSilentRefresh, token) {
    const resultsContainer = document.getElementById('results');
    const details = await loadGmbRouteDetails(routeInfo.region, routeInfo.route);

    if (!details.length) {
      if (!isSilentRefresh && token === activeRequestToken) {
        resultsContainer.innerHTML = '<div class="loading">未有發現該小巴路線資料（請確認區域與編號）。</div>';
      }
      return;
    }

    if (!isSilentRefresh && token === activeRequestToken) resultsContainer.innerHTML = '';

    const gmbJobs = [];
    details.forEach((variant, variantIdx) => {
      if (routeInfo.gmbRouteId != null && String(variant.route_id) !== String(routeInfo.gmbRouteId)) return;
      const desc = `${variant.description_tc || ''} ${variant.remarks_tc || ''}`;
      const variantIsSpecial = /特別/.test(desc) || variantIdx > 0;
      (variant.directions || []).forEach(dir => {
        const dirText = `${desc} ${dir.remarks_tc || ''}`;
        gmbJobs.push({
          variant,
          dir,
          isSpecial: variantIsSpecial || /特別/.test(dirText),
          routeSeq: Number(dir.route_seq) || 0
        });
      });
    });
    gmbJobs.sort((a, b) => {
      if (a.isSpecial !== b.isSpecial) return a.isSpecial ? 1 : -1;
      if (a.routeSeq !== b.routeSeq) return a.routeSeq - b.routeSeq;
      return String(a.variant.route_id).localeCompare(String(b.variant.route_id), undefined, { numeric: true });
    });

    for (const job of gmbJobs) {
      const variant = job.variant;
      const dir = job.dir;
        if (token !== activeRequestToken) return;
        const dirKey = `gmb-${variant.route_id}-${dir.route_seq}`;
        const title = `${dir.orig_tc} ➔ ${dir.dest_tc}`;
        const sub = [
          REGION_LABEL[variant.region] || variant.region,
          `route_id ${variant.route_id}`,
          `方向 ${dir.route_seq}`,
          variant.description_tc || '',
          dir.remarks_tc || ''
        ].filter(Boolean).join('　');

        try {
          const data = await fetchJson(`${API.GMB_ROUTE_STOPS}${variant.route_id}/${dir.route_seq}`);
          const stops = data?.data?.route_stops || [];
          if (!stops.length) continue;

          let card = document.getElementById(dirKey);
          if (!card) {
            card = document.createElement('div');
            card.id = dirKey;
            card.className = 'dir-card';
            card.innerHTML = `<div class="dir-title">${title}<span class="dir-sub">${sub}</span></div><ul class="stop-list"></ul>`;
            resultsContainer.appendChild(card);
          }

          const stopListEl = card.querySelector('.stop-list');
          await mapPool(stops, 6, async (stop) => {
            if (token !== activeRequestToken) return;
            const stopItemId = `gmb-stop-${variant.route_id}-${dir.route_seq}-${stop.stop_seq}`;
            let stopItem = document.getElementById(stopItemId);
            if (!stopItem) {
              stopItem = document.createElement('li');
              stopItem.id = stopItemId;
              stopItem.className = 'stop-item';
              stopItem.innerHTML = `
                <span class="stop-name">${stop.stop_seq}. ${stop.name_tc || '未知車站'}</span>
                <div class="eta-box">載入中...</div>
              `;
              stopListEl.appendChild(stopItem);
            }

            try {
              const etaData = await fetchJson(`${API.GMB_ETA}${variant.route_id}/${dir.route_seq}/${stop.stop_seq}`);
              const rawList = etaData?.data?.eta || [];
              const rawEtas = rawList.map(normalizeGmbEta).filter(Boolean);
              stopItem.querySelector('.eta-box').innerHTML = renderEtaSlots(rawEtas);
            } catch {
              stopItem.querySelector('.eta-box').innerHTML = renderEtaSlots([], { error: true });
            }
          });
        } catch (e) {
          console.error('GMB route-stop error', e);
        }
    }
  }

  function normalizeGmbEta(e) {
    if (!e) return null;
    return {
      eta: e.timestamp || e.eta || null,
      remark: e.remarks_tc || e.rmk_tc || e.remarks_en || ''
    };
  }

  async function getCtbStopName(stopId) {
    if (ctbStopNameCache.has(stopId)) return ctbStopNameCache.get(stopId);
    try {
      const stopData = await fetchJson(`${API.CTB_STOP}${stopId}`);
      const name = stopData.data?.name_tc || '未知車站';
      ctbStopNameCache.set(stopId, name);
      return name;
    } catch {
      return '未知車站';
    }
  }

  async function loadCtbRouteData(routeInfo, isSilentRefresh, token) {

    const directions = [
      { path: 'outbound', code: 'O', word: '去程', orig: routeInfo.orig, dest: routeInfo.dest },

          card = document.createElement('div');

          card.innerHTML = `<div class="dir-title">${dir.word}：${dir.orig || '?'} ➔ ${dir.dest || '?'}<span class="dir-sub">城巴 ${routeInfo.route}${jointNote}</span></div><ul class="stop-list"></ul>`;

          const stopItem = document.createElement('li');
          stopItem.id = stopItemId;
          stopItem.className = 'stop-item';
          stopItem.innerHTML = `<span class="stop-name">${stopRef.seq}. 載入中...</span><div class="eta-box">...</div>`;
          stopListEl.appendChild(stopItem);
        });
        await mapPool(stops, 6, async (stopRef) => {
          if (token !== activeRequestToken) return;
          const stopItemId = `ctb-stop-${containerId}-${stopRef.seq}-${stopRef.stop}`;
          let stopItem = document.getElementById(stopItemId);
          if (!stopItem) return;
          try {
            const stopName = await getCtbStopName(stopRef.stop);
            const etaData = await fetchJson(`${API.CTB_ETA}${stopRef.stop}/${encodeURIComponent(routeInfo.route)}`);
            const rawEtas = (etaData.data || []).filter(e => {
              const sameDir = e.dir === dir.code;
              const sameSeq = e.seq == null || String(e.seq) === String(stopRef.seq);
              return sameDir && sameSeq;
            }).sort((a, b) => (a.eta_seq || 0) - (b.eta_seq || 0));
            stopItem.querySelector('.stop-name').innerText = `${stopRef.seq}. ${stopName}`;
            stopItem.querySelector('.eta-box').innerHTML = renderEtaSlots(rawEtas.map(normalizeKmbEta));
          } catch (err) {
            console.error('CTB stop/eta error', err);
            stopItem.querySelector('.eta-box').innerHTML = renderEtaSlots([], { error: true });
          }
        });
      } catch (err) {
        console.error('CTB route-stop error', err);
      }
    }
  }

  async function loadNlbRouteData(routeInfo, isSilentRefresh, token) {
    const resultsContainer = document.getElementById('results');
    if (!isSilentRefresh && token === activeRequestToken) resultsContainer.innerHTML = '';
    const containerId = `nlb-card-${routeInfo.routeId}`;
    try {
      const data = await fetchJson(`${API.NLB_STOP_LIST}&routeId=${encodeURIComponent(routeInfo.routeId)}`);
      const stops = data.stops || [];
      if (!stops.length) {
        if (!isSilentRefresh) resultsContainer.innerHTML = '<div class="loading">未有發現該嶼巴路線車站。</div>';
        return;
      }
      let card = document.getElementById(containerId);
      if (!card) {
        card = document.createElement('div');
        card.id = containerId;
        card.className = 'dir-card';
        card.innerHTML = `<div class="dir-title">${routeInfo.origDest || routeInfo.route}<span class="dir-sub">嶼巴 ${routeInfo.route}　routeId=${routeInfo.routeId}</span></div><ul class="stop-list"></ul>`;
        resultsContainer.appendChild(card);
      }
      const stopListEl = card.querySelector('.stop-list');
      await mapPool(stops, 6, async (stop, idx) => {
        if (token !== activeRequestToken) return;
        const stopItemId = `nlb-stop-${routeInfo.routeId}-${stop.stopId}`;
        let stopItem = document.getElementById(stopItemId);
        if (!stopItem) {
          stopItem = document.createElement('li');
          stopItem.id = stopItemId;
          stopItem.className = 'stop-item';
          stopItem.innerHTML = `<span class="stop-name">${idx + 1}. ${stop.stopName_c || stop.stopName_e}</span><div class="eta-box">載入中...</div>`;
          stopListEl.appendChild(stopItem);
        }
        try {
          const etaData = await fetchJson(
            `${API.NLB_ETA}&routeId=${encodeURIComponent(routeInfo.routeId)}&stopId=${encodeURIComponent(stop.stopId)}&language=zh`
          );
          const rawList = etaData.estimatedArrivals || [];
          const rawEtas = rawList.map(e => {
            const t = parseFlexibleTimestamp(e.estimatedArrivalTime);
            const scheduled = String(e.noGPS) === '1';
            return {
              eta: t,
              remark: scheduled ? '原定班次' : ''
            };
          });
          stopItem.querySelector('.eta-box').innerHTML = renderEtaSlots(rawEtas);
        } catch {
          stopItem.querySelector('.eta-box').innerHTML = renderEtaSlots([], { error: true });
        }
      });

      console.error('NLB error', e);
      if (!isSilentRefresh) resultsContainer.innerHTML = '<div class="loading">嶼巴資料載入失敗。</div>';
    }
  }

  function parseMtrArrival(bus) {
    if (!bus) return null;
    const text = bus.arrivalTimeText || bus.departureTimeText || '';
    const sec = Number(bus.arrivalTimeInSecond);
    let eta = null;
    if (!Number.isNaN(sec) && sec >= 0 && sec < 864000) {
      eta = new Date(Date.now() + sec * 1000).toISOString();
    }
    const scheduled = String(bus.isScheduled) === '1';
    const remark = [text, scheduled ? '原定班次' : '', bus.busDestination || ''].filter(Boolean).join(' ');
    if (!eta && !remark) return null;
    return { eta, remark };
  }

  async function loadMtrBusRouteData(routeInfo, isSilentRefresh, token) {
    const resultsContainer = document.getElementById('results');
    if (!isSilentRefresh && token === activeRequestToken) resultsContainer.innerHTML = '';
    let schedule = {};
    try {
      schedule = await fetchJsonPost(API.MTR_BUS_ETA, { language: 'zh', routeName: routeInfo.route });
    } catch (e) {
      console.error('MTR bus ETA error', e);
    }
    const statusRemark = schedule.routeStatusRemarkTitle || schedule.routeStatusRemarkContent || '';
    const liveStops = schedule.busStop || [];
    const csvStops = mtrBusStops.filter(s => s.ROUTE_ID === routeInfo.route);
    const dirs = {};
    csvStops.forEach(s => {
      const d = s.DIRECTION || 'O';
      if (!dirs[d]) dirs[d] = [];
      dirs[d].push(s);
    });
    Object.keys(dirs).forEach(d => dirs[d].sort((a, b) => Number(a.STATION_SEQNO) - Number(b.STATION_SEQNO)));

    const dirKeys = Object.keys(dirs).length
      ? Object.keys(dirs).sort((a, b) => {
          const rank = (d) => (d === 'O' ? 0 : d === 'I' ? 1 : 2);
          return rank(a) - rank(b);
        })
      : ['ALL'];
    for (const d of dirKeys) {
      const containerId = `mtrb-card-${routeInfo.route}-${d}`;
      let card = document.getElementById(containerId);
      if (!card) {
        const word = d === 'I' ? '回程' : (d === 'O' ? '去程' : '路線');
        card = document.createElement('div');
        card.id = containerId;
        card.className = 'dir-card';
        card.innerHTML = `<div class="dir-title">${word}：${routeInfo.origDest || routeInfo.route}<span class="dir-sub">港鐵巴士 ${routeInfo.route}${statusRemark ? '　' + statusRemark : ''}</span></div><ul class="stop-list"></ul>`;
        resultsContainer.appendChild(card);
      } else if (statusRemark) {
        const sub = card.querySelector('.dir-sub');
        if (sub) sub.textContent = `港鐵巴士 ${routeInfo.route}　${statusRemark}`;
      }
      const stopListEl = card.querySelector('.stop-list');
      const stops = dirs[d] || [];
      if (!stops.length && liveStops.length && d === dirKeys[0]) {
        liveStops.forEach((ls, idx) => {
          const sid = `mtrb-live-${routeInfo.route}-${idx}`;
          let stopItem = document.getElementById(sid);
          if (!stopItem) {
            stopItem = document.createElement('li');
            stopItem.id = sid;
            stopItem.className = 'stop-item';
            stopListEl.appendChild(stopItem);
          }
          const name = ls.busStopName_zh || ls.busStopName_chi || ls.busStopId || `站 ${idx + 1}`;
          const rawEtas = (ls.bus || []).map(parseMtrArrival).filter(Boolean);
          const slotsHtml = renderEtaSlots(rawEtas, statusRemark ? { remark: statusRemark } : null);
          stopItem.innerHTML = `<span class="stop-name">${idx + 1}. ${name}</span><div class="eta-box">${slotsHtml}</div>`;
        });
        continue;
      }
      stops.forEach((stop, idx) => {
        const sid = `mtrb-stop-${routeInfo.route}-${d}-${stop.STATION_ID}`;
        let stopItem = document.getElementById(sid);
        if (!stopItem) {
          stopItem = document.createElement('li');
          stopItem.id = sid;
          stopItem.className = 'stop-item';
          stopListEl.appendChild(stopItem);
        }
        const live = liveStops.find(ls =>
          String(ls.busStopId) === String(stop.STATION_ID) ||
          (ls.busStopName_zh && ls.busStopName_zh.includes(stop.STATION_NAME_CHI))
        );
        const rawEtas = (live?.bus || []).map(parseMtrArrival).filter(Boolean);
        const slotsHtml = renderEtaSlots(rawEtas, statusRemark ? { remark: statusRemark } : null);
        stopItem.innerHTML = `<span class="stop-name">${stop.STATION_SEQNO || idx + 1}. ${stop.STATION_NAME_CHI}</span><div class="eta-box">${slotsHtml}</div>`;
      });
    }
  }

  function parseFlexibleTimestamp(value) {
    if (value == null || value === '') return null;
    let t = String(value).trim();
    if (!t) return null;
    t = t.replace(' ', 'T');
    if (/[zZ]$/.test(t) || /[+-]\d{2}:?\d{2}$/.test(t)) return t;
    return `${t}+08:00`;
  }

  function isCtbKmbJoint(routeNo) {
    const code = String(routeNo || '').toUpperCase();
    const ctb = searchIndex.find(r => r.type === 'CTB' && String(r.route).toUpperCase() === code);
    const kmb = searchIndex.find(r => r.type === 'KMB' && String(r.route).toUpperCase() === code);
    if (!ctb || !kmb) return false;
    const pair = (a, b) => [a, b].filter(Boolean).map(s => String(s).replace(/\s+/g, ''));
    const ctbEnds = pair(ctb.orig, ctb.dest);
    const kmbEnds = pair(kmb.orig, kmb.dest);
    if (!ctbEnds.length || !kmbEnds.length) return false;
    const similar = (x, y) => x === y || (x.length >= 2 && y.length >= 2 && (x.includes(y) || y.includes(x)));
    return ctbEnds.some(a => kmbEnds.some(b => similar(a, b)));
  }

  function isDepartedEta(etaObj) {
    if (!etaObj || !etaObj.eta) return false;
    const parsed = new Date(parseFlexibleTimestamp(etaObj.eta) || etaObj.eta);
    const diffMs = parsed - Date.now();
    return !Number.isNaN(diffMs) && diffMs <= -90000;
  }

  function renderEtaSlots(rawEtas, emptyFallback) {
    const list = (rawEtas || []).filter(Boolean);
    const keep = [];
    let departed = false;
    list.forEach((e) => {
      if (isDepartedEta(e)) departed = true;
      else keep.push(e);
    });
    let html = '';
    for (let i = 0; i < displaySlotCount; i++) {
      if (keep[i]) {
        html += formatEtaSlot(keep[i], i);
      } else if (i === 0 && departed && !keep.length && !emptyFallback) {
        html += formatEtaSlot({ remark: '已離開' }, i);
      } else if (emptyFallback && !keep.length) {
        html += formatEtaSlot(emptyFallback, i);
      } else {
        html += formatEtaSlot(null, i);
      }
    }
    return html;
  }

  function formatEtaSlot(etaObj, index) {
    const labels = ['下一班', '第二班', '第三班'];
    const slotLabel = labels[index] || `第${index + 1}班`;

    if (etaObj && etaObj.error) {
      return slotHtml(slotLabel, etaObj.remark || '暫時無法取得', 'eta-empty');
    }

    if (!etaObj || (!etaObj.eta && !etaObj.remark)) {
      return slotHtml(slotLabel, '沒有班次', 'eta-empty');
    }

    const remark = etaObj.remark || '';
    const isScheduled = remark.includes('原定班次');

    if (etaObj.eta) {
      const parsed = new Date(parseFlexibleTimestamp(etaObj.eta) || etaObj.eta);
      const diffMs = parsed - new Date();
      if (Number.isNaN(diffMs)) {
        return slotHtml(slotLabel, remark || '時間格式異常', 'eta-empty');
      }
      if (diffMs <= -90000) {
        return slotHtml(slotLabel, remark || '沒有班次', 'eta-empty');
      }
      const diffMins = Math.floor(diffMs / 60000);
      if (diffMins <= 0) {
        return slotHtml(slotLabel, '0 分（即將抵達）', 'eta-now');
      }
      if (isScheduled) {
        return slotHtml(slotLabel, `${diffMins} 分（原定）`, 'eta-scheduled');
      }
      const extra = remark && !isScheduled ? `｜${remark}` : '';
      return slotHtml(slotLabel, `${diffMins} 分（實時）${extra}`, 'eta-realtime');
    }

    return slotHtml(slotLabel, remark, isScheduled ? 'eta-scheduled' : 'eta-empty');
  }

  function slotHtml(label, value, cls) {
    return `
      <div class="eta-slot ${cls}">
        <span class="eta-label">${label}</span>
        <span class="eta-value">${value}</span>
      </div>`;
  }

  function handleSlotCountChange(val) {
    displaySlotCount = parseInt(val, 10);
    if (selectedRoute) fetchAndDisplayETA(selectedRoute, true);
  }

  function handleRefreshIntervalChange(val) {
    const next = parseInt(val, 10);
    if (!next || next < 1) return;
    refreshIntervalSec = next;
    if (selectedRoute) resetAutoRefresh();
    else setCountdownDisplay(refreshIntervalSec);
  }

  function pulseFloatRefreshOpaque() {
    const btn = document.getElementById('floatRefreshBtn');
    if (!btn) return;
    btn.classList.add('is-opaque');
    if (floatOpaqueTimer) clearTimeout(floatOpaqueTimer);
    floatOpaqueTimer = setTimeout(() => {
      btn.classList.remove('is-opaque');
      btn.blur();
      floatOpaqueTimer = null;
    }, 2000);
  }

  function manualRefresh() {
    if (!selectedRoute || isManualRefreshing) return;
    const btn = document.getElementById('floatRefreshBtn');
    pulseFloatRefreshOpaque();
    isManualRefreshing = true;
    if (btn) btn.disabled = true;
    resetAutoRefresh();
    fetchAndDisplayETA(selectedRoute, true).finally(() => {
      isManualRefreshing = false;
      if (btn) btn.disabled = false;
    });
  }
</script>
