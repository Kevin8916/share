<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港巴士與小巴實時 ETA 查詢平台 (v15.8)</title>
  <style>
    :root {
      --primary-color: #0056b3;
      --bg-color: #f4f7f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e0e0e0;
      --accent-kmb: #e60012;
      --accent-ctb: #f5a623;
      --accent-nlb: #2c6e49;
      --accent-mtr: #00706a;
      --accent-gmb: #27ae60;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 850px;
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      font-size: 1.6rem;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    h1 .app-version {
      font-size: 0.5em;
      font-weight: 600;
      vertical-align: middle;
      margin-left: 0.2em;
    }

    .search-box {
      position: relative;
      margin-bottom: 12px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 1.1rem;
      border: 2px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary-color);
    }

    .status-hint {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 16px;
      padding-left: 4px;
    }

    .autocomplete-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid #ddd;
      border-radius: 0 0 8px 8px;
      max-height: 480px;
      overflow-y: auto;
      z-index: 1000;
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    }

    .autocomplete-item {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .autocomplete-item:hover {
      background-color: #eef5ff;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      color: white;
      white-space: nowrap;
    }

    .badge-kmb { background-color: var(--accent-kmb); }
    .badge-ctb { background-color: var(--accent-ctb); color: #222; }
    .badge-nlb { background-color: var(--accent-nlb); }
    .badge-mtr { background-color: var(--accent-mtr); }
    .badge-gmb { background-color: var(--accent-gmb); }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #e8f4fd;
      border: 1px solid #b6e0fe;
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      color: #004085;
      flex-wrap: wrap;
      gap: 10px;
    }

    .timer-badge {
      background: #0056b3;
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: bold;
      min-width: 2.2em;
      text-align: center;
      display: inline-block;
      font-variant-numeric: tabular-nums;
    }

    .direction-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .dir-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid var(--border-color);
      scroll-margin-top: 60px;
    }

    .dir-jump {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      position: sticky;
      top: 0;
      z-index: 30;
      margin: 0 0 12px;
      padding: 8px 0;
      background: var(--bg-color);
      -webkit-overflow-scrolling: touch;
    }
    .dir-jump[hidden] { display: none !important; }
    .dir-jump-btn {
      flex: 0 0 auto;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid #8ab4d8;
      background: #fff;
      color: #004085;
      font: inherit;
      font-weight: 700;
      font-size: 0.88rem;
      line-height: 1.3;
      cursor: pointer;
      white-space: nowrap;
    }
    .dir-jump-btn.is-clip {
      max-width: 14em;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dir-jump-btn:hover { background: #e8f4fd; }
    .dir-jump-btn.is-active,
    .dir-jump-btn.is-active:hover {
      background: #0056b3;
      color: #fff;
      border-color: #0056b3;
    }

    .dir-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--primary-color);
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 8px;
      margin-bottom: 14px;
    }

    .dir-sub {
      display: block;
      font-size: 0.8rem;
      font-weight: normal;
      color: #666;
      margin-top: 4px;
    }

    .stop-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .stop-item {
      padding: 12px 0;
      border-bottom: 1px dashed #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
    }

    .stop-name {
      font-weight: 500;
      font-size: 1rem;
      color: #222;
      align-self: flex-start;
      max-width: 100%;
    }

    .eta-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      align-self: flex-end;
      width: 100%;
    }

    .eta-slot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.88rem;
      border: 1px solid #ddd;
      background: #ffffff;
    }

    .eta-slot .eta-label {
      font-weight: bold;
      color: #555;
      padding-right: 4px;
      border-right: 1px solid rgba(0,0,0,0.15);
    }

    .eta-slot .eta-value { font-weight: bold; }

    .eta-slot.eta-realtime { background: #e1f5fe; border-color: #81d4fa; }
    .eta-slot.eta-realtime .eta-value { color: #0288d1; }

    .eta-slot.eta-now { background: #e8f5e9; border-color: #a5d6a7; }
    .eta-slot.eta-now .eta-value { color: #2e7d32; }

    .eta-slot.eta-scheduled { background: #fff3e0; border-color: #ffe0b2; }
    .eta-slot.eta-scheduled .eta-value { color: #e65100; }

    .eta-slot.eta-empty { background: #f5f5f5; border-color: #e0e0e0; }
    .eta-slot.eta-empty .eta-value { color: #9e9e9e; }

    .eta-slot { transition: background-color .2s ease, color .2s ease, box-shadow .2s ease; }
    .eta-slot.changed { box-shadow: 0 0 0 2px rgba(0, 86, 179, 0.45); }

    .loading {
      text-align: center;
      color: #666;
      font-style: italic;
      padding: 30px;
      background: white;
      border-radius: 8px;
      border: 1px dashed #ccc;
    }

    .status-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 12px;
    }

    .status-controls label {
      font-size: 0.88rem;
      font-weight: bold;
      color: #004085;
    }

    .control-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .slot-select {
      padding: 4px 8px;
      font-size: 0.88rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      background-color: #fff;
      font-weight: bold;
      color: #333;
      cursor: pointer;
    }

    .joint-btn {
      padding: 4px 10px;
      font-size: 0.82rem;
      border-radius: 999px;
      border: 1px solid #8ab4d8;
      background: #fff;
      font-weight: 700;
      color: #004085;
      cursor: pointer;
    }
    .joint-btn[hidden] { display: none !important; }

    #floatRefreshBtn {
      display: none;
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      right: max(16px, env(safe-area-inset-right));
      z-index: 1100;
      background: #0295FF;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 6px 13.5px;
      font-size: 0.7125rem;
      font-weight: 700;
      letter-spacing: 0.015em;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 9px rgba(2, 149, 255, 0.22);
      opacity: 0.5;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: background-color 0.2s, transform 0.1s, opacity 0.2s, box-shadow 0.2s;
    }

    #floatRefreshBtn.is-opaque,
    #floatRefreshBtn:active {
      background-color: #007FE0;
      opacity: 1;
      box-shadow: 0 3px 9px rgba(2, 149, 255, 0.38);
    }
    #floatRefreshBtn:active { transform: scale(0.96); }

    @media (hover: hover) and (pointer: fine) {
      #floatRefreshBtn:hover,
      #floatRefreshBtn:focus-visible {
        background-color: #007FE0;
        opacity: 1;
        box-shadow: 0 3px 9px rgba(2, 149, 255, 0.38);
      }
    }

    #floatRefreshBtn:disabled {
      cursor: not-allowed;
      transform: none;
    }
    #floatRefreshBtn:disabled:not(.is-opaque) {
      opacity: 0.4;
    }
  </style>
</head>

<div class="container">
  <h1>🚍 香港巴士 / 小巴 ETA 實時到站查詢 <span class="app-version">(v15.8)</span></h1>

    <div id="autocompleteList" class="autocomplete-list" style="display:none;"></div>
  </div>
  <div id="initStatus" class="status-hint">⏳ 正在載入九巴/龍運、城巴、嶼巴、港鐵巴士及綠色小巴路線資料...</div>

    <span>正在檢視路線：<strong id="activeRouteName">--</strong></span>
    <div class="status-controls">
      <button type="button" id="jointSwitchBtn" class="joint-btn" hidden></button>
      <div class="control-group">
        <label for="slotCountSelect">班次</label>
        <select id="slotCountSelect" class="slot-select">
          <option value="1">1 班</option>
          <option value="2" selected>2 班</option>
          <option value="3">3 班</option>
        </select>
      </div>
      <div class="control-group">
        <label for="refreshIntervalSelect">自動更新</label>
        <select id="refreshIntervalSelect" class="slot-select">
          <option value="10">10 秒</option>
          <option value="12" selected>12 秒</option>
          <option value="15">15 秒</option>
        </select>
      </div>
      <span id="countdownTimer" class="timer-badge" title="距離下次自動更新">12</span> 秒
    </div>
  </div>

  <div id="dirJump" class="dir-jump" hidden></div>

  <div id="results" class="direction-container"></div>
</div>

<button type="button" id="floatRefreshBtn" aria-label="手動刷新到站時間" title="手動刷新到站時間">刷新[12]</button>

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => {
      if (c === '&') return '&' + 'amp;';
      if (c === '<') return '&' + 'lt;';
      if (c === '>') return '&' + 'gt;';
      if (c === '"') return '&' + 'quot;';
      return '&#39;';
    });
  }

  function pageVisible() {

  function isAbortError(e) {
    return !!(e && e.name === 'AbortError');
  }
  function abortLive() {
    if (!liveAbort) return;
    liveAbort.abort();
    liveAbort = null;
  }
  function beginLive() {
    abortLive();
    liveAbort = new AbortController();
    return liveAbort.signal;
  }

  async function fetchWithTimeout(url, init, useLive) {
    const parent = useLive && liveAbort ? liveAbort.signal : null;
    const timeoutCtl = new AbortController();
    const t = setTimeout(() => timeoutCtl.abort(), FETCH_MS);
    const onParent = () => timeoutCtl.abort();
    if (parent) {
      if (parent.aborted) {
        clearTimeout(t);
        const err = new Error('aborted');
        err.name = 'AbortError';
        throw err;
      }
      parent.addEventListener('abort', onParent, { once: true });
    }
    try {
      const res = await fetch(url, Object.assign({ cache: 'no-store' }, init || {}, { signal: timeoutCtl.signal }));
      if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + url);
      return await res.json();
    } catch (e) {
      if (e && e.name === 'AbortError') {
        if (parent && parent.aborted) {
          const err = new Error('aborted');
          err.name = 'AbortError';
          throw err;
        }
        const err = new Error('逾時');
        err.name = 'TimeoutError';
        throw err;
      }
      throw e;
    } finally {
      clearTimeout(t);
      if (parent) parent.removeEventListener('abort', onParent);
    }
  }

  function fetchJson(url, opts) {
    return fetchWithTimeout(url, {}, !!(opts && opts.live));
  }
  function fetchJsonPost(url, body, opts) {
    return fetchWithTimeout(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    }, !!(opts && opts.live));
  }

  async function mapPool(items, limit, worker) {
    const results = new Array(items.length);
    let cursor = 0;
    async function run() {
      while (cursor < items.length) {
        const i = cursor++;
        results[i] = await worker(items[i], i);
      }
    }
    const n = Math.min(limit, items.length);
    if (n <= 0) return results;
    await Promise.all(Array.from({ length: n }, run));
    return results;
  }

  function formatCountdown(sec) {
    return String(Math.max(0, sec)).padStart(2, '0');
  }
  function setCountdownDisplay(sec) {
    const formatted = formatCountdown(sec);
    const el = document.getElementById('countdownTimer');
    if (el) el.textContent = formatted;
    if (floatRefreshBtn && !floatRefreshBtn.classList.contains('is-opaque')) {
      floatRefreshBtn.textContent = '刷新[' + formatted + ']';
    }
  }
  function stopClock() {
    if (clockTimer) {
      clearInterval(clockTimer);
      clockTimer = null;
    }
  }
  function startClock() {
    if (!pageVisible() || !selectedRoute) {
      stopClock();
      return;
    }
    secondsRemaining = refreshIntervalSec;
    setCountdownDisplay(secondsRemaining);
    stopClock();
    clockTimer = setInterval(() => {
      if (!pageVisible()) {
        stopClock();
        return;
      }
      secondsRemaining -= 1;
      if (secondsRemaining <= 0) {
        if (inFlight) {
          secondsRemaining = 0;
        } else if (selectedRoute) {
          secondsRemaining = refreshIntervalSec;
          fetchAndDisplayETA(selectedRoute, { silent: true, visibleOnly: true });
        } else {
          secondsRemaining = refreshIntervalSec;
        }
      }
      setCountdownDisplay(secondsRemaining);
    }, 1000);
  }

  function isNearViewport(el) {
    const r = el.getBoundingClientRect();
    return r.bottom >= -VIEW_MARGIN && r.top <= (window.innerHeight || 0) + VIEW_MARGIN;
  }
  function visibleStopEls() {
    return Array.from(document.querySelectorAll('#results .stop-item[data-op]')).filter(isNearViewport);
  }
  function rememberVisibleStops(items) {
    const list = items || visibleStopEls();
    lastVisibleIds = new Set(list.map((el) => el.id).filter(Boolean));
  }
  function scheduleNewlyVisibleRefresh() {
    if (scrollDebounce) clearTimeout(scrollDebounce);
    scrollDebounce = setTimeout(() => {
      scrollDebounce = null;
      refreshNewlyVisibleStops();
    }, SCROLL_DEBOUNCE_MS);
  }
  async function refreshNewlyVisibleStops() {
    if (!selectedRoute || !pageVisible() || isManualRefreshing) return;
    if (selectedRoute.type === 'MTRB') {
      rememberVisibleStops();
      return;
    }
    if (inFlight) {
      pendingVisibleRefresh = true;
      return;
    }
    const items = visibleStopEls();
    const newly = items.filter((el) => el.id && !lastVisibleIds.has(el.id));
    rememberVisibleStops(items);
    if (!newly.length) return;
    const token = ++activeRequestToken;
    if (!liveAbort || liveAbort.signal.aborted) beginLive();
    inFlight = true;
    try {
      await refreshVisibleStops(token, newly);
    } catch (e) {
      if (!isAbortError(e)) console.error(e);
    } finally {
      if (token === activeRequestToken) {
        inFlight = false;
        rememberVisibleStops();
        if (pendingVisibleRefresh) {
          pendingVisibleRefresh = false;
          scheduleNewlyVisibleRefresh();
        }
      }
    }
  }

  function flashFloat(text) {
    if (!floatRefreshBtn || floatRefreshBtn.style.display === 'none') return;
    floatRefreshBtn.classList.add('is-opaque');
    floatRefreshBtn.textContent = text;
    if (floatOpaqueTimer) clearTimeout(floatOpaqueTimer);
    floatOpaqueTimer = setTimeout(() => {

      floatOpaqueTimer = null;
      setCountdownDisplay(secondsRemaining);
    }, 2000);
  }

      isRoutesLoaded = true;
      statusHint.innerHTML = '✅ 資料載入完成！九巴/龍運 <strong>' + kmbUniqueList.length +
        '</strong>、城巴 <strong>' + ctbRoutes.length +
        '</strong>、嶼巴 <strong>' + nlbRoutes.length +
        '</strong>、港鐵巴士 <strong>' + mtrRoutes.length +
        '</strong>、綠色小巴編號 <strong>' + gmbRoutes.length +
        '</strong>。選線後才抓車站與 ETA。';
      statusHint.style.color = '#27ae60';
      handleSearch();
    } catch (e) {
      console.error('路線資料初始化失敗', e);
      statusHint.textContent = '⚠️ 路線資料初始化失敗，請檢查網路連線或重新整理網頁。';
      statusHint.style.color = '#e60012';
    }
  }

  function sortMatches(filtered, query) {
    return filtered.sort((a, b) => {
      const routeA = a.route.toUpperCase();
      const routeB = b.route.toUpperCase();
      const exactA = routeA === query;
      const exactB = routeB === query;
      if (exactA && !exactB) return -1;
      if (!exactA && exactB) return 1;
      const startsA = routeA.startsWith(query);
      const startsB = routeB.startsWith(query);
      if (startsA && !startsB) return -1;
      if (!startsA && startsB) return 1;
      if (a.type !== b.type) return (TYPE_ORDER[a.type] ?? 9) - (TYPE_ORDER[b.type] ?? 9);
      if (routeA.length !== routeB.length) return routeA.length - routeB.length;
      if (a.type === 'NLB') {
        return String(a.routeId).localeCompare(String(b.routeId), undefined, { numeric: true });
      }
      if (a.type === 'GMB') {
        if (a.region !== b.region) return String(a.region).localeCompare(String(b.region));
        return String(a.gmbRouteId || '').localeCompare(String(b.gmbRouteId || ''), undefined, { numeric: true });
      }
      return routeA.localeCompare(routeB);
    });
  }

  function routeLabel(item) {
    if (item.type === 'KMB' || item.type === 'CTB') {
      return item.route + '（' + (item.orig || '?') + ' ↔ ' + (item.dest || '?') + '）';
    }
    if (item.type === 'NLB') {
      return item.route + '（' + (item.origDest || '嶼巴') + '）';
    }
    if (item.type === 'MTRB') {
      return item.route + '（' + (item.origDest || '港鐵巴士') + '）';
    }
    const region = REGION_LABEL[item.region] || item.region;
    if (item.detailSummary) return item.route + ' · ' + region + '（' + item.detailSummary + '）';
    return item.route + ' · ' + region + '專線小巴';
  }

  function renderAutocomplete(filtered) {
    autocompleteList.textContent = '';
    if (!filtered.length) {
      autocompleteList.style.display = 'none';
      return;
    }
    filtered.slice(0, 80).forEach(item => {
      const div = document.createElement('div');
      div.className = 'autocomplete-item';
      const left = document.createElement('span');
      const strong = document.createElement('strong');
      strong.textContent = item.route;
      const small = document.createElement('small');
      small.style.color = '#666';
      small.style.marginLeft = '8px';
      small.textContent = routeLabel(item);
      left.appendChild(strong);
      left.appendChild(small);
      const badge = document.createElement('span');
      badge.className = 'badge ' + (BADGE_CLASS[item.type] || 'badge-kmb');
      badge.textContent = item.company;
      div.appendChild(left);
      div.appendChild(badge);
      div.addEventListener('click', () => {
        routeInput.value = item.route;
        autocompleteList.style.display = 'none';
        selectRoute(item);
      });
      autocompleteList.appendChild(div);
    });
    autocompleteList.style.display = 'block';
  }

  function expandGmbByRouteId(baseItem, details) {
    if (!details?.length) {
      return [{ ...baseItem, detailSummary: baseItem.detailSummary || '' }];
    }
    return details.map((d) => {
      const dir = d.directions?.[0];
      const summary = dir
        ? (dir.orig_tc || '?') + ' ↔ ' + (dir.dest_tc || '?')
        : (d.description_tc || '');
      return {
        ...baseItem,
        gmbRouteId: d.route_id,
        description: d.description_tc || '',
        detailSummary: [summary, d.description_tc].filter(Boolean).filter((v, i, arr) => arr.indexOf(v) === i).join('　')
      };
    });
  }

  async function enrichGmbMatches(matches) {
    const targets = matches.filter(m => m.type === 'GMB' && m.gmbRouteId == null).slice(0, 12);
    await mapPool(targets, 4, async (item) => {
      try {
        const details = await loadGmbRouteDetails(item.region, item.route);
        const expanded = expandGmbByRouteId(item, details);
        const idx = searchIndex.findIndex(r =>
          r.type === 'GMB' && r.region === item.region && r.route === item.route && r.gmbRouteId == null
        );
        if (idx >= 0) searchIndex.splice(idx, 1, ...expanded);
        else expanded.forEach(row => {
          if (!searchIndex.some(r => r.type === 'GMB' && r.region === row.region && r.route === row.route && r.gmbRouteId === row.gmbRouteId)) {
            searchIndex.push(row);
          }
        });
      } catch (e) {
        if (isAbortError(e)) throw e;
        console.warn('GMB 詳情預載失敗', item, e);
      }
    });
  }

  async function handleSearch() {
    const query = routeInput.value.trim().toUpperCase();
    if (!query || !isRoutesLoaded) {
      autocompleteList.style.display = 'none';
      return;
    }
    const matchQuery = (q) => sortMatches(
      searchIndex.filter(r => r.route.toUpperCase().includes(q)),
      q
    );
    let filtered = matchQuery(query);
    renderAutocomplete(filtered);
    if (filtered.some(x => x.type === 'GMB' && x.gmbRouteId == null)) {
      await enrichGmbMatches(filtered);
      if (routeInput.value.trim().toUpperCase() !== query) return;
      filtered = matchQuery(query);
      renderAutocomplete(filtered);
    }
  }

  async function loadGmbRouteDetails(region, route) {
    const key = region + ':' + route;
    if (gmbDetailCache.has(key)) return gmbDetailCache.get(key);
    const data = await fetchJson(API.GMB_ROUTES + '/' + region + '/' + encodeURIComponent(route));
    const details = Array.isArray(data.data) ? data.data : [];
    gmbDetailCache.set(key, details);
    return details;
  }

  function isCtbKmbJoint(routeNo) {
    const code = String(routeNo || '').toUpperCase();
    const ctb = searchIndex.some(r => r.type === 'CTB' && String(r.route).toUpperCase() === code);
    const kmb = searchIndex.some(r => r.type === 'KMB' && String(r.route).toUpperCase() === code);
    return ctb && kmb;
  }

  function findJointOther(item) {
    if (!item || (item.type !== 'KMB' && item.type !== 'CTB')) return null;
    const want = item.type === 'KMB' ? 'CTB' : 'KMB';
    const code = String(item.route).toUpperCase();
    return searchIndex.find(r => r.type === want && String(r.route).toUpperCase() === code) || null;
  }

  function updateJointSwitch(routeItem) {
    const other = findJointOther(routeItem);
    if (!other) {
      jointSwitchBtn.hidden = true;
      jointSwitchBtn.onclick = null;
      return;
    }
    jointSwitchBtn.hidden = false;
    jointSwitchBtn.textContent = other.type === 'KMB' ? '改看九巴／龍運班次' : '改看城巴班次';
    jointSwitchBtn.onclick = () => selectRoute(other);
  }

  function selectRoute(routeItem) {
    selectedRoute = routeItem;
    const statusBar = document.getElementById('statusBar');
    const activeRouteName = document.getElementById('activeRouteName');
    statusBar.style.display = 'flex';
    let extra = '';
    if (routeItem.type === 'GMB') {
      extra = '（' + (REGION_LABEL[routeItem.region] || routeItem.region) +
        (routeItem.detailSummary ? '　' + routeItem.detailSummary : '') + '）';
    }
    if (routeItem.type === 'NLB' && routeItem.origDest) extra = '（' + routeItem.origDest + '）';
    if (routeItem.type === 'MTRB' && routeItem.origDest) extra = '（' + routeItem.origDest + '）';
    activeRouteName.textContent = routeItem.company + ' - ' + routeItem.route + extra;
    updateJointSwitch(routeItem);
    if (floatRefreshBtn) floatRefreshBtn.style.display = 'inline-flex';
    lastVisibleIds = new Set();
    pendingVisibleRefresh = false;
    if (scrollDebounce) {
      clearTimeout(scrollDebounce);
      scrollDebounce = null;
    }
    fetchAndDisplayETA(selectedRoute, { silent: false, visibleOnly: false });
    startClock();
  }

  async function fetchAndDisplayETA(routeInfo, opts) {
    opts = opts || {};
    const silent = !!opts.silent;
    const visibleOnly = !!opts.visibleOnly;
    if (!routeInfo) return false;
    if (visibleOnly && inFlight) return null;
    if (!pageVisible() && visibleOnly) return null;

    const token = ++activeRequestToken;
    if (!visibleOnly) beginLive();
    else if (!liveAbort || liveAbort.signal.aborted) beginLive();

    inFlight = true;
    const resultsContainer = document.getElementById('results');
    if (!silent && token === activeRequestToken) {
      resultsContainer.innerHTML = '<div class="loading">正在實時查詢車站及到站時間 (ETA)...</div>';
    }
    try {
      if (visibleOnly) {
        if (routeInfo.type === 'MTRB') await loadMtrBusRouteData(routeInfo, true, token);
        else await refreshVisibleStops(token);
      } else if (routeInfo.type === 'KMB') {
        await loadKmbRouteData(routeInfo, silent, token);
      } else if (routeInfo.type === 'GMB') {
        await loadGmbRouteData(routeInfo, silent, token);
      } else if (routeInfo.type === 'CTB') {
        await loadCtbRouteData(routeInfo, silent, token);
      } else if (routeInfo.type === 'NLB') {
        await loadNlbRouteData(routeInfo, silent, token);
      } else if (routeInfo.type === 'MTRB') {
        await loadMtrBusRouteData(routeInfo, silent, token);
      }
      if (token !== activeRequestToken) return null;
      secondsRemaining = refreshIntervalSec;
      setCountdownDisplay(secondsRemaining);
      return true;
    } catch (e) {
      if (isAbortError(e) || token !== activeRequestToken) return null;
      console.error(e);
      if (!silent && token === activeRequestToken) {
        resultsContainer.innerHTML = '<div class="loading">資料載入失敗，請稍後再試。</div>';
      }
      return false;
    } finally {
      if (token === activeRequestToken) {
        inFlight = false;
        rememberVisibleStops();
        if (pendingVisibleRefresh) {
          pendingVisibleRefresh = false;
          scheduleNewlyVisibleRefresh();
        }
      }
    }
  }

  function kmbDirPath(bound) {
    return bound === 'I' ? 'inbound' : 'outbound';
  }
  function kmbDirCode(pathOrBound) {
    if (pathOrBound === 'inbound' || pathOrBound === 'I') return 'I';
    return 'O';
  }

  function applyKmbEta(stopItem, etaData, job, seq) {
    const wantDir = kmbDirCode(job.bound);
    const wantSt = String(job.serviceType);
    const rawEtas = (etaData.data || []).filter(e => {
      const sameDir = e.dir === wantDir;
      const sameSt = e.service_type == null || String(e.service_type) === wantSt;
      const sameSeq = e.seq == null || String(e.seq) === String(seq);
      return sameDir && sameSt && sameSeq;
    });
    rawEtas.sort((a, b) => (a.eta_seq || 0) - (b.eta_seq || 0));
    setEtaBox(stopItem.querySelector('.eta-box'), renderEtaSlots(rawEtas.map(normalizeKmbEta)));
  }

  async function loadKmbRouteData(routeInfo, isSilentRefresh, token) {
    const resultsContainer = document.getElementById('results');
    const variants = rawKmbRoutes.filter(r => r.route === routeInfo.route);
    const jobs = variants.map(variant => ({
      route: variant.route,
      bound: variant.bound,
      serviceType: String(variant.service_type),
      orig: variant.orig_tc,
      dest: variant.dest_tc
    })).sort((a, b) => {
      const specialA = a.serviceType === '1' ? 0 : 1;
      const specialB = b.serviceType === '1' ? 0 : 1;
      if (specialA !== specialB) return specialA - specialB;
      const boundA = a.bound === 'I' ? 1 : 0;
      const boundB = b.bound === 'I' ? 1 : 0;
      if (boundA !== boundB) return boundA - boundB;
      return a.serviceType.localeCompare(b.serviceType, undefined, { numeric: true });
    });

    if (!isSilentRefresh && token === activeRequestToken) resultsContainer.innerHTML = '';
    const joint = isCtbKmbJoint(routeInfo.route);

    for (const job of jobs) {
      if (token !== activeRequestToken) return;
      const dirPath = kmbDirPath(job.bound);
      const containerId = 'kmb-card-' + job.route + '-' + dirPath + '-' + job.serviceType;
      const isSpecial = job.serviceType !== '1';
      const specialSuffix = isSpecial ? '[特別班次]' : '';
      const dirWord = job.bound === 'I' ? '回程' : '去程';

      try {
        const data = await fetchJson(API.KMB_ROUTE_STOPS + job.route + '/' + dirPath + '/' + job.serviceType, { live: true });
        const stops = (data.data || []).slice().sort((a, b) => Number(a.seq) - Number(b.seq));
        if (!stops.length) continue;

        let card = document.getElementById(containerId);
        if (!card) {
          card = document.createElement('div');
          card.id = containerId;
          card.className = 'dir-card';
          const jointNote = joint ? '　聯營線只顯示九巴／龍運班次' : '';
          card.innerHTML = '<div class="dir-title">' + esc(dirWord + '：' + (job.orig || '') + ' ➔ ' + (job.dest || '') + specialSuffix) +
            '<span class="dir-sub">' + esc('九巴/龍運 ' + job.route + jointNote) + '</span></div><ul class="stop-list"></ul>';
          resultsContainer.appendChild(card);
        }

        const stopListEl = card.querySelector('.stop-list');
        stops.forEach((stopRef) => {
          const stopItemId = 'kmb-stop-' + containerId + '-' + stopRef.seq + '-' + stopRef.stop;
          if (document.getElementById(stopItemId)) return;
          const stopItem = document.createElement('li');
          stopItem.id = stopItemId;
          stopItem.className = 'stop-item';
          stopItem.setAttribute('data-op', 'KMB');
          stopItem.setAttribute('data-stop', String(stopRef.stop));
          stopItem.setAttribute('data-route', String(job.route));
          stopItem.setAttribute('data-st', String(job.serviceType));
          stopItem.setAttribute('data-bound', String(job.bound));
          stopItem.setAttribute('data-seq', String(stopRef.seq));
          stopItem.innerHTML = '<span class="stop-name">' + esc(String(stopRef.seq)) + '. 載入中...</span><div class="eta-box">...</div>';
          stopListEl.appendChild(stopItem);
        });
        await mapPool(stops, 6, async (stopRef) => {
          if (token !== activeRequestToken) return;
          const stopItemId = 'kmb-stop-' + containerId + '-' + stopRef.seq + '-' + stopRef.stop;
          const stopItem = document.getElementById(stopItemId);
          if (!stopItem) return;
          try {
            const stopName = await getKmbStopName(stopRef.stop);
            const etaData = await fetchJson(API.KMB_ETA + stopRef.stop + '/' + job.route + '/' + job.serviceType, { live: true });
            stopItem.querySelector('.stop-name').textContent = stopRef.seq + '. ' + stopName;
            applyKmbEta(stopItem, etaData, job, stopRef.seq);
          } catch (err) {
            if (isAbortError(err)) throw err;
            console.error('KMB stop/eta error', err);
            setEtaBox(stopItem.querySelector('.eta-box'), renderEtaSlots([], { error: true }));
          }
        });
      } catch (err) {
        if (isAbortError(err)) throw err;
        console.error('KMB route-stop error', err);
      }
    }
  }

  async function getKmbStopName(stopId) {
    if (kmbStopNameCache.has(stopId)) return kmbStopNameCache.get(stopId);
    try {
      const stopData = await fetchJson(API.KMB_STOP + stopId, { live: true });
      const name = stopData.data?.name_tc || '未知車站';
      kmbStopNameCache.set(stopId, name);
      return name;
    } catch (e) {
      if (isAbortError(e)) throw e;
      return '未知車站';
    }
  }

  function normalizeKmbEta(row) {
    if (!row) return null;
    return {
      eta: row.eta || null,
      remark: row.rmk_tc || row.rmk_en || ''
    };
  }

  async function loadGmbRouteData(routeInfo, isSilentRefresh, token) {
    const resultsContainer = document.getElementById('results');
    const details = await loadGmbRouteDetails(routeInfo.region, routeInfo.route);

    if (!details.length) {
      if (!isSilentRefresh && token === activeRequestToken) {
        resultsContainer.innerHTML = '<div class="loading">未有發現該小巴路線資料（請確認區域與編號）。</div>';
      }
      return;
    }

    if (!isSilentRefresh && token === activeRequestToken) resultsContainer.innerHTML = '';

    const gmbJobs = [];
    details.forEach((variant, variantIdx) => {
      if (routeInfo.gmbRouteId != null && String(variant.route_id) !== String(routeInfo.gmbRouteId)) return;
      const desc = (variant.description_tc || '') + ' ' + (variant.remarks_tc || '');
      const variantIsSpecial = /特別/.test(desc) || variantIdx > 0;
      (variant.directions || []).forEach(dir => {
        const dirText = desc + ' ' + (dir.remarks_tc || '');
        gmbJobs.push({
          variant,
          dir,
          isSpecial: variantIsSpecial || /特別/.test(dirText),
          routeSeq: Number(dir.route_seq) || 0
        });
      });
    });
    gmbJobs.sort((a, b) => {
      if (a.isSpecial !== b.isSpecial) return a.isSpecial ? 1 : -1;
      if (a.routeSeq !== b.routeSeq) return a.routeSeq - b.routeSeq;
      return String(a.variant.route_id).localeCompare(String(b.variant.route_id), undefined, { numeric: true });
    });

    for (const job of gmbJobs) {
      const variant = job.variant;
      const dir = job.dir;
      if (token !== activeRequestToken) return;
      const dirKey = 'gmb-' + variant.route_id + '-' + dir.route_seq;
      const title = (dir.orig_tc || '') + ' ➔ ' + (dir.dest_tc || '');
      const sub = [
        REGION_LABEL[variant.region] || variant.region,
        variant.description_tc || '',
        dir.remarks_tc || ''
      ].filter(Boolean).join('　');

      try {
        const data = await fetchJson(API.GMB_ROUTE_STOPS + variant.route_id + '/' + dir.route_seq, { live: true });
        const stops = (data?.data?.route_stops || []).slice().sort((a, b) => Number(a.stop_seq) - Number(b.stop_seq));
        if (!stops.length) continue;

        let card = document.getElementById(dirKey);
        if (!card) {
          card = document.createElement('div');
          card.id = dirKey;
          card.className = 'dir-card';
          card.innerHTML = '<div class="dir-title">' + esc(title) + '<span class="dir-sub">' + esc(sub) + '</span></div><ul class="stop-list"></ul>';
          resultsContainer.appendChild(card);
        }

        const stopListEl = card.querySelector('.stop-list');
        stops.forEach((stop) => {
          const stopItemId = 'gmb-stop-' + variant.route_id + '-' + dir.route_seq + '-' + stop.stop_seq;
          if (document.getElementById(stopItemId)) return;
          const stopItem = document.createElement('li');
          stopItem.id = stopItemId;
          stopItem.className = 'stop-item';
          stopItem.setAttribute('data-op', 'GMB');
          stopItem.setAttribute('data-route-id', String(variant.route_id));
          stopItem.setAttribute('data-route-seq', String(dir.route_seq));
          stopItem.setAttribute('data-stop-seq', String(stop.stop_seq));
          stopItem.innerHTML = '<span class="stop-name">' + esc(String(stop.stop_seq)) + '. ' +
            esc(stop.name_tc || '未知車站') + '</span><div class="eta-box">載入中...</div>';
          stopListEl.appendChild(stopItem);
        });
        await mapPool(stops, 6, async (stop) => {
          if (token !== activeRequestToken) return;
          const stopItemId = 'gmb-stop-' + variant.route_id + '-' + dir.route_seq + '-' + stop.stop_seq;
          const stopItem = document.getElementById(stopItemId);
          if (!stopItem) return;
          try {
            const etaData = await fetchJson(API.GMB_ETA + variant.route_id + '/' + dir.route_seq + '/' + stop.stop_seq, { live: true });
            const rawEtas = (etaData?.data?.eta || []).map(normalizeGmbEta).filter(Boolean);
            setEtaBox(stopItem.querySelector('.eta-box'), renderEtaSlots(rawEtas));
          } catch (e) {
            if (isAbortError(e)) throw e;
            setEtaBox(stopItem.querySelector('.eta-box'), renderEtaSlots([], { error: true }));
          }
        });
      } catch (e) {
        if (isAbortError(e)) throw e;
        console.error('GMB route-stop error', e);
      }
    }
  }

  function normalizeGmbEta(e) {
    if (!e) return null;
    return {
      eta: e.timestamp || e.eta || null,
      remark: e.remarks_tc || e.rmk_tc || e.remarks_en || ''
    };
  }

  async function getCtbStopName(stopId) {
    if (ctbStopNameCache.has(stopId)) return ctbStopNameCache.get(stopId);
    try {
      const stopData = await fetchJson(API.CTB_STOP + stopId, { live: true });
      const name = stopData.data?.name_tc || '未知車站';
      ctbStopNameCache.set(stopId, name);
      return name;
    } catch (e) {
      if (isAbortError(e)) throw e;
      return '未知車站';
    }
  }

  async function loadCtbRouteData(routeInfo, isSilentRefresh, token) {
    const resultsContainer = document.getElementById('results');
    if (!isSilentRefresh && token === activeRequestToken) resultsContainer.innerHTML = '';
    const joint = isCtbKmbJoint(routeInfo.route);
    const directions = [
      { path: 'outbound', code: 'O', word: '去程', orig: routeInfo.orig, dest: routeInfo.dest },
      { path: 'inbound', code: 'I', word: '回程', orig: routeInfo.dest, dest: routeInfo.orig }
    ];
    for (const dir of directions) {
      if (token !== activeRequestToken) return;
      const containerId = 'ctb-card-' + routeInfo.route + '-' + dir.path;
      try {
        const data = await fetchJson(API.CTB_ROUTE_STOPS + encodeURIComponent(routeInfo.route) + '/' + dir.path, { live: true });
        const stops = (data.data || []).slice().sort((a, b) => Number(a.seq) - Number(b.seq));
        if (!stops.length) continue;
        let card = document.getElementById(containerId);
        if (!card) {
          card = document.createElement('div');
          card.id = containerId;
          card.className = 'dir-card';
          const jointNote = joint ? '　聯營線只顯示城巴班次' : '';
          card.innerHTML = '<div class="dir-title">' + esc(dir.word + '：' + (dir.orig || '?') + ' ➔ ' + (dir.dest || '?')) +
            '<span class="dir-sub">' + esc('城巴 ' + routeInfo.route + jointNote) + '</span></div><ul class="stop-list"></ul>';
          resultsContainer.appendChild(card);
        }
        const stopListEl = card.querySelector('.stop-list');
        stops.forEach((stopRef) => {
          const stopItemId = 'ctb-stop-' + containerId + '-' + stopRef.seq + '-' + stopRef.stop;
          if (document.getElementById(stopItemId)) return;
          const stopItem = document.createElement('li');
          stopItem.id = stopItemId;
          stopItem.className = 'stop-item';
          stopItem.setAttribute('data-op', 'CTB');
          stopItem.setAttribute('data-stop', String(stopRef.stop));
          stopItem.setAttribute('data-route', String(routeInfo.route));
          stopItem.setAttribute('data-bound', String(dir.code));
          stopItem.setAttribute('data-seq', String(stopRef.seq));
          stopItem.innerHTML = '<span class="stop-name">' + esc(String(stopRef.seq)) + '. 載入中...</span><div class="eta-box">...</div>';
          stopListEl.appendChild(stopItem);
        });
        await mapPool(stops, 6, async (stopRef) => {
          if (token !== activeRequestToken) return;
          const stopItemId = 'ctb-stop-' + containerId + '-' + stopRef.seq + '-' + stopRef.stop;
          const stopItem = document.getElementById(stopItemId);
          if (!stopItem) return;
          try {
            const stopName = await getCtbStopName(stopRef.stop);
            const etaData = await fetchJson(API.CTB_ETA + stopRef.stop + '/' + encodeURIComponent(routeInfo.route), { live: true });
            const rawEtas = (etaData.data || []).filter(e => {
              const sameDir = e.dir === dir.code;
              const sameSeq = e.seq == null || String(e.seq) === String(stopRef.seq);
              return sameDir && sameSeq;
            }).sort((a, b) => (a.eta_seq || 0) - (b.eta_seq || 0));
            stopItem.querySelector('.stop-name').textContent = stopRef.seq + '. ' + stopName;
            setEtaBox(stopItem.querySelector('.eta-box'), renderEtaSlots(rawEtas.map(normalizeKmbEta)));
          } catch (err) {
            if (isAbortError(err)) throw err;
            console.error('CTB stop/eta error', err);
            setEtaBox(stopItem.querySelector('.eta-box'), renderEtaSlots([], { error: true }));
          }
        });
      } catch (err) {
        if (isAbortError(err)) throw err;
        console.error('CTB route-stop error', err);
      }
    }
  }

  async function loadNlbRouteData(routeInfo, isSilentRefresh, token) {

      });

          );

  function getMtrBusStopName(stopId) {
    const id = String(stopId || '').trim();
    if (!id) return '';
    return mtrStopNameCache.get(id) || id;
  }

  function mtrBusDirKey(stopId) {
    const m = String(stopId || '').match(/-n?([DU])\d+$/i);
    return m ? m[1].toUpperCase() : 'D';
  }

  function mtrBusStopLabel(ls, fallbackIdx) {
    return (ls && (ls.busStopName_zh || ls.busStopName_chi || ls.busStopName_tc)) ||
      getMtrBusStopName(ls && ls.busStopId) || ('站 ' + fallbackIdx);
  }

  function parseMtrArrival(bus) {
    if (!bus) return null;
    const text = bus.arrivalTimeText || bus.departureTimeText || '';
    const sec = Number(bus.arrivalTimeInSecond);
    let eta = null;
    if (!Number.isNaN(sec) && sec >= 0 && sec < 864000) {
      eta = new Date(Date.now() + sec * 1000).toISOString();
    }
    const scheduled = String(bus.isScheduled) === '1';
    const remark = [scheduled ? '原定班次' : '', bus.busDestination || ''].filter(Boolean).join(' ');
    if (!eta && !remark && !text) return null;
    if (!eta && !remark) return { eta: null, remark: text };
    return { eta, remark };
  }

  async function loadMtrBusRouteData(routeInfo, isSilentRefresh, token) {
    const resultsContainer = document.getElementById('results');
    if (!isSilentRefresh && token === activeRequestToken) resultsContainer.innerHTML = '';
    let schedule = {};
    let mtrBusFetchFailed = false;
    try {
      schedule = await fetchJsonPost(API.MTR_BUS_ETA, { language: 'zh', routeName: routeInfo.route }, { live: true });
    } catch (e) {
      if (isAbortError(e)) throw e;
      console.error('MTR bus ETA error', e);
      mtrBusFetchFailed = true;
    }
    const statusRemark = schedule.routeStatusRemarkTitle || schedule.routeStatusRemarkContent || '';
    const liveStops = schedule.busStop || [];
    const groups = { D: [], U: [] };
    liveStops.forEach((ls) => {
      const key = mtrBusDirKey(ls.busStopId);
      (groups[key] || groups.D).push(ls);
    });
    const dirOrder = ['D', 'U'];
    const hasAny = dirOrder.some((k) => groups[k].length);
    if (!hasAny) {
      if (!isSilentRefresh && token === activeRequestToken) {
        const remarkTitle = String(schedule.routeStatusRemarkTitle || '').trim();
        const remarkContent = String(schedule.routeStatusRemarkContent || '').trim();
        let notice = '暫時沒有港鐵巴士班次資料。<br>港鐵未有提供班次或服務狀態。';
        if (mtrBusFetchFailed) {
          notice = '暫時無法取得港鐵巴士資料。<br>請稍後再試。';
        } else if (remarkTitle || remarkContent) {
          notice = esc(remarkTitle || remarkContent);
          if (remarkTitle && remarkContent && remarkTitle !== remarkContent) notice += '<br>' + esc(remarkContent);
        }
        resultsContainer.innerHTML = '<div class="loading">' + notice + '</div>';
      }
      return;
    }
    dirOrder.forEach((dirKey) => {
      const group = groups[dirKey];
      if (!group.length) return;
      const dirWord = dirKey === 'U' ? '回程' : '去程';
      const origName = mtrBusStopLabel(group[0], 1);
      const destName = mtrBusStopLabel(group[group.length - 1], group.length);
      const containerId = 'mtrb-card-' + routeInfo.route + '-' + dirKey;
      let card = document.getElementById(containerId);
      const titleText = dirWord + '：' + origName + ' ➔ ' + destName;
      const subText = '港鐵巴士 ' + routeInfo.route + (statusRemark ? '　' + statusRemark : '');
      if (!card) {
        card = document.createElement('div');
        card.id = containerId;
        card.className = 'dir-card';
        card.innerHTML = '<div class="dir-title">' + esc(titleText) +
          '<span class="dir-sub">' + esc(subText) + '</span></div><ul class="stop-list"></ul>';
        resultsContainer.appendChild(card);
      } else {
        const titleEl = card.querySelector('.dir-title');
        const sub = card.querySelector('.dir-sub');
        if (titleEl) {
          const titleNode = titleEl.childNodes[0];
          if (titleNode && titleNode.nodeType === 3) titleNode.textContent = titleText;
        }
        if (sub) sub.textContent = subText;
      }
      const stopListEl = card.querySelector('.stop-list');
      group.forEach((ls, idx) => {
        const sid = 'mtrb-live-' + routeInfo.route + '-' + (ls.busStopId || dirKey + '-' + idx);
        let stopItem = document.getElementById(sid);
        if (!stopItem) {
          stopItem = document.createElement('li');
          stopItem.id = sid;
          stopItem.className = 'stop-item';
          stopItem.setAttribute('data-op', 'MTRB');
          stopListEl.appendChild(stopItem);
        }
        const name = mtrBusStopLabel(ls, idx + 1);
        const rawEtas = (ls.bus || []).map(parseMtrArrival).filter(Boolean);
        const slotsHtml = renderEtaSlots(rawEtas, statusRemark ? { remark: statusRemark } : null);
        const nameText = String(idx + 1) + '. ' + name;
        let nameEl = stopItem.querySelector('.stop-name');
        let box = stopItem.querySelector('.eta-box');
        if (!nameEl || !box) {
          stopItem.innerHTML = '<span class="stop-name">' + esc(nameText) + '</span><div class="eta-box">' + slotsHtml + '</div>';
        } else {
          nameEl.textContent = nameText;
          setEtaBox(box, slotsHtml);
        }
      });
    });
  }

  async function refreshVisibleStops(token, onlyItems) {
    const items = onlyItems || visibleStopEls();
    if (!items.length) return;
    await mapPool(items, 6, async (el) => {
      if (token !== activeRequestToken) return;
      const op = el.getAttribute('data-op');
      const box = el.querySelector('.eta-box');
      try {
        if (op === 'KMB') {
          const stop = el.getAttribute('data-stop');
          const route = el.getAttribute('data-route');
          const st = el.getAttribute('data-st');
          const bound = el.getAttribute('data-bound');
          const seq = el.getAttribute('data-seq');
          const etaData = await fetchJson(API.KMB_ETA + stop + '/' + route + '/' + st, { live: true });
          applyKmbEta(el, etaData, { bound: bound, serviceType: st }, seq);
        } else if (op === 'CTB') {
          const stop = el.getAttribute('data-stop');
          const route = el.getAttribute('data-route');
          const bound = el.getAttribute('data-bound');
          const seq = el.getAttribute('data-seq');
          const etaData = await fetchJson(API.CTB_ETA + stop + '/' + encodeURIComponent(route), { live: true });
          const rawEtas = (etaData.data || []).filter(e => {
            const sameDir = e.dir === bound;
            const sameSeq = e.seq == null || String(e.seq) === String(seq);

          }).sort((a, b) => (a.eta_seq || 0) - (b.eta_seq || 0));

        } else if (op === 'GMB') {

          const etaData = await fetchJson(API.GMB_ETA + routeId + '/' + routeSeq + '/' + stopSeq, { live: true });
          const rawEtas = (etaData?.data?.eta || []).map(normalizeGmbEta).filter(Boolean);
          setEtaBox(box, renderEtaSlots(rawEtas));

          );
          const rawEtas = (etaData.estimatedArrivals || []).map(e => {

            return { eta: t, remark: scheduled ? '原定班次' : '' };
          });

        }
      } catch (e) {
        if (isAbortError(e)) throw e;
        setEtaBox(box, renderEtaSlots([], { error: true }));
      }
    });
  }

  function parseFlexibleTimestamp(value) {
    if (value == null || value === '') return null;
    let t = String(value).trim();
    if (!t) return null;
    t = t.replace(' ', 'T');
    if (/[zZ]$/.test(t) || /[+-]\d{2}:?\d{2}$/.test(t)) return t;
    return t + '+08:00';
  }

  function isDepartedEta(etaObj) {
    if (!etaObj || !etaObj.eta) return false;
    const parsed = new Date(parseFlexibleTimestamp(etaObj.eta) || etaObj.eta);
    const diffMs = parsed - Date.now();
    return !Number.isNaN(diffMs) && diffMs <= -90000;
  }

  function renderEtaSlots(rawEtas, emptyFallback) {
    const list = (rawEtas || []).filter(Boolean);
    const keep = [];
    let departed = false;
    list.forEach((e) => {
      if (isDepartedEta(e)) departed = true;
      else keep.push(e);
    });
    let html = '';
    for (let i = 0; i < displaySlotCount; i++) {
      if (keep[i]) {
        html += formatEtaSlot(keep[i], i);
      } else if (i === 0 && departed && !keep.length && !emptyFallback) {
        html += formatEtaSlot({ remark: '已離開' }, i);
      } else if (emptyFallback && !keep.length) {
        html += formatEtaSlot(emptyFallback, i);
      } else {
        html += formatEtaSlot(null, i);
      }
    }
    return html;
  }

  function formatEtaSlot(etaObj, index) {
    const labels = ['下一班', '第二班', '第三班'];
    const slotLabel = labels[index] || ('第' + (index + 1) + '班');

    if (etaObj && etaObj.error) {
      return slotHtml(slotLabel, etaObj.remark || '暫時無法取得', 'eta-empty');
    }
    if (!etaObj || (!etaObj.eta && !etaObj.remark)) {
      return slotHtml(slotLabel, '沒有班次', 'eta-empty');
    }

    const remark = etaObj.remark || '';
    const isScheduled = remark.includes('原定班次');

    if (etaObj.eta) {
      const parsed = new Date(parseFlexibleTimestamp(etaObj.eta) || etaObj.eta);
      const diffMs = parsed - new Date();
      if (Number.isNaN(diffMs)) {
        return slotHtml(slotLabel, remark || '時間格式異常', 'eta-empty');
      }
      if (diffMs <= -90000) {
        return slotHtml(slotLabel, remark || '沒有班次', 'eta-empty');
      }
      const diffMins = Math.floor(diffMs / 60000);
      if (diffMins <= 0) {
        return slotHtml(slotLabel, '0 分（即將抵達）', 'eta-now');
      }
      if (isScheduled) {
        return slotHtml(slotLabel, diffMins + ' 分（原定）', 'eta-scheduled');
      }
      const extra = remark && !isScheduled ? '｜' + remark : '';
      return slotHtml(slotLabel, diffMins + ' 分（實時）' + extra, 'eta-realtime');
    }

    return slotHtml(slotLabel, remark, isScheduled ? 'eta-scheduled' : 'eta-empty');
  }

  function slotHtml(label, value, cls) {
    return '<div class="eta-slot ' + cls + '"><span class="eta-label">' + esc(label) +
      '</span><span class="eta-value">' + esc(value) + '</span></div>';
  }

  function etaBoxLooksPlaceholder(html) {
    const t = String(html || '').trim();
    if (!t || t === '...' || t === '載入中...') return true;
    return t.indexOf('eta-slot') < 0;
  }

  function etaSlotSignature(el) {
    const cls = Array.from(el.classList).filter((c) => c !== 'changed').sort().join(' ');
    return cls + '\0' + (el.textContent || '');
  }

  function setEtaBox(box, html) {
    if (!box) return;
    if (etaBoxLooksPlaceholder(box.innerHTML)) {
      box.innerHTML = html;
      return;
    }
    const prevKeys = Array.from(box.querySelectorAll('.eta-slot')).map(etaSlotSignature);
    const nextWrap = document.createElement('div');
    nextWrap.innerHTML = html;
    const nextKeys = Array.from(nextWrap.querySelectorAll('.eta-slot')).map(etaSlotSignature);
    if (prevKeys.length === nextKeys.length && prevKeys.every((k, i) => k === nextKeys[i])) return;
    box.innerHTML = html;
    box.querySelectorAll('.eta-slot').forEach((p, i) => {
      if (nextKeys[i] === prevKeys[i]) return;
      p.classList.add('changed');
      setTimeout(() => p.classList.remove('changed'), 600);
    });
  }

  async function manualRefresh() {
    if (!selectedRoute || isManualRefreshing || !pageVisible()) return;
    isManualRefreshing = true;
    if (floatRefreshBtn) {
      floatRefreshBtn.disabled = true;
      floatRefreshBtn.classList.add('is-opaque');
      floatRefreshBtn.textContent = '更新中';
    }
    startClock();
    let result = null;
    try {
      result = await fetchAndDisplayETA(selectedRoute, { silent: true, visibleOnly: false });
    } catch (e) {
      result = false;
    } finally {
      isManualRefreshing = false;
      if (floatRefreshBtn) floatRefreshBtn.disabled = false;
    }
    if (!selectedRoute || (floatRefreshBtn && floatRefreshBtn.style.display === 'none')) return;
    if (result === true) flashFloat('已刷新');
    else if (result === false) flashFloat('更新失敗');
    else {
      if (floatRefreshBtn) floatRefreshBtn.classList.remove('is-opaque');
      setCountdownDisplay(secondsRemaining);
    }
  }

  setCountdownDisplay(secondsRemaining);

  routeInput.addEventListener('input', handleSearch);
  document.addEventListener('click', (e) => {

    if (selectedRoute) startClock();
    else setCountdownDisplay(refreshIntervalSec);
  });
  floatRefreshBtn.addEventListener('click', manualRefresh);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      activeRequestToken += 1;

  });
  window.addEventListener('scroll', scheduleNewlyVisibleRefresh, { passive: true });

  const dirJump = document.getElementById('dirJump');
  const JUMP_ARROW = ' ➔ ';

  function cardJumpMeta(card) {
    const titleEl = card.querySelector('.dir-title');
    if (!titleEl) return null;
    const textNode = titleEl.childNodes[0];
    const raw = (textNode && textNode.nodeType === 3 ? textNode.textContent : '').trim();
    if (!raw) return null;
    const subEl = card.querySelector('.dir-sub');
    const sub = subEl ? subEl.textContent : '';
    const headed = raw.match(/^(去程|回程)：(.*) ➔ (.*)$/);
    if (headed) {
      const destFull = headed[3].trim();
      const orig = headed[2].trim();
      if (destFull.endsWith('[特別班次]')) {
        return {
          base: '往' + destFull,
          orig: orig,
          title: orig + ' ➔ ' + destFull,
          clip: false,
          keepBase: true
        };
      }
      return {
        base: '(' + headed[1] + ') 往' + (destFull || '？'),
        orig: orig,
        title: orig + ' ➔ ' + destFull,
        clip: false
      };
    }
    const arrowAt = raw.indexOf(JUMP_ARROW);
    if (arrowAt !== -1) {
      const orig = raw.slice(0, arrowAt).trim();
      const dest = raw.slice(arrowAt + JUMP_ARROW.length).trim();
      const special = sub.includes('特別') || raw.includes('特別');
      const full = orig + JUMP_ARROW + dest;
      return {
        base: (special ? '特別 ' : '') + full,
        orig: orig,
        title: full,
        clip: true
      };
    }
    return { base: raw, orig: '', title: raw, clip: true };
  }

  function syncDirJump() {
    const cards = Array.from(document.querySelectorAll('#results > .dir-card'));
    if (cards.length < 2) {
      dirJump.hidden = true;
      dirJump.replaceChildren();
      return;
    }
    const metas = cards.map(cardJumpMeta).map((meta, i) => meta && Object.assign(meta, { card: cards[i] })).filter(Boolean);
    if (metas.length < 2) {
      dirJump.hidden = true;
      dirJump.replaceChildren();
      return;
    }
    const counts = {};
    metas.forEach((meta) => { counts[meta.base] = (counts[meta.base] || 0) + 1; });
    dirJump.hidden = false;
    dirJump.replaceChildren();
    metas.forEach((meta) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'dir-jump-btn' + (meta.clip ? ' is-clip' : '');
      let label = meta.base;
      if (!meta.clip && !meta.keepBase && counts[meta.base] > 1 && meta.orig) label += ' · ' + meta.orig;
      btn.textContent = label;
      btn.title = meta.title;
      btn._jumpCard = meta.card;
      btn.addEventListener('click', () => {
        pinJumpCard(meta.card);
        meta.card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      dirJump.appendChild(btn);
    });
    markActiveJump();
  }

  let jumpPinnedCard = null;
  let jumpPinTimer = 0;

  function pinJumpCard(card) {
    jumpPinnedCard = card;
    markActiveJump();
    if (jumpPinTimer) clearTimeout(jumpPinTimer);
    jumpPinTimer = setTimeout(() => {
      jumpPinTimer = 0;
      jumpPinnedCard = null;
      markActiveJump();
    }, 2000);
  }

  function releasePinnedJump() {
    if (!jumpPinnedCard && !jumpPinTimer) return;
    jumpPinnedCard = null;
    if (jumpPinTimer) {
      clearTimeout(jumpPinTimer);
      jumpPinTimer = 0;
    }
    markActiveJump();
  }

  function cardAtJumpLine(cards, line) {
    let above = null;
    for (const card of cards) {
      const rect = card.getBoundingClientRect();
      if (rect.top <= line && rect.bottom > line) return card;
      if (rect.top <= line) above = card;
    }
    return above || cards[0] || null;
  }

  function jumpAlignLine(card) {
    const raw = card ? parseFloat(getComputedStyle(card).scrollMarginTop) : 60;
    const margin = Number.isNaN(raw) ? 60 : raw;
    return margin + 4;
  }

  function markActiveJump() {
    const buttons = Array.from(dirJump.querySelectorAll('.dir-jump-btn'));
    if (dirJump.hidden || !buttons.length) return;
    const cards = buttons.map((btn) => btn._jumpCard).filter(Boolean);
    const pinned = jumpPinnedCard && cards.indexOf(jumpPinnedCard) !== -1 ? jumpPinnedCard : null;
    const current = pinned || cardAtJumpLine(cards, jumpAlignLine(cards[0]));
    buttons.forEach((btn) => {
      const on = btn._jumpCard === current;
      btn.classList.toggle('is-active', on);
      if (on) btn.setAttribute('aria-current', 'true');
      else btn.removeAttribute('aria-current');
    });
  }

  let jumpActiveFrame = 0;
  function scheduleActiveJump() {
    if (jumpActiveFrame) return;
    jumpActiveFrame = requestAnimationFrame(() => {
      jumpActiveFrame = 0;
      markActiveJump();
    });
  }

  new MutationObserver(syncDirJump).observe(document.getElementById('results'), { childList: true });
  window.addEventListener('scroll', scheduleActiveJump, { passive: true });
  window.addEventListener('scrollend', releasePinnedJump);
  window.addEventListener('resize', scheduleActiveJump);

  setCountdownDisplay(secondsRemaining);

  initRoutes();
})();
</script>

</body>
</html>
