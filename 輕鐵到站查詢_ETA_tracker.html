    .pill { transition: background-color .2s ease, color .2s ease, box-shadow .2s ease; }
    .pill.changed { box-shadow: 0 0 0 2px color-mix(in oklab, var(--primary) 45%, transparent); }
    .eta { transition: color .2s ease; }
    .warn { color: var(--warn); font-size: .9rem; }
    .muted { color: var(--muted); font-size: .9rem; }

    }

      if (t === nq) best = Math.min(best ?? 0, 0);

    if (ch === "-" || en === "-") return { kind: "now", label: "即將到站", sortKey: 0 };
    if (/正在離開|departing/i.test(blob)) return { kind: "gone", label: "正在離開", sortKey: -1 };
    if (/即將|arriving/i.test(blob)) return { kind: "now", label: "即將到站", sortKey: 0 };
    const m = blob.match(/(\d+)/);

  }

  async function fetchRouteDirs(route) {
    return Promise.all(route.directions.map(async (d) => {
      const destLabel = d.destZh;
      const stops = await mapPool(d.stops, 6, async (st) => {
        const meta = STOP_BY_ID[st.stopId];
        try {
          const schedule = await fetchStation(st.stopId);
          return {
            seq: st.seq, stopId: st.stopId,
            nameZh: meta ? meta.nameZh : "車站 " + st.stopId,
            nameEn: meta ? meta.nameEn : "",
            interchangeTml: !!(meta && meta.interchangeTml),
            trains: filterRouteTrains(schedule, route.code, d.destZh, route.circular),
          };
        } catch (e) {
          return {
            seq: st.seq, stopId: st.stopId,
            nameZh: meta ? meta.nameZh : "車站 " + st.stopId,
            nameEn: meta ? meta.nameEn : "",
            interchangeTml: !!(meta && meta.interchangeTml),
            trains: [], error: true
          };
        }
      });
      return { dir: d.dir, origZh: d.origZh, destZh: destLabel, circular: route.circular, stops };
    }));
  }

  async function selectRoute(code, silent) {
    const switching = !silent;
    const next = { kind: "route", code };
    if (switching) rememberNav(next);
    selection = next;
    setHash("route", code);
    homeEl.innerHTML = "";
    const route = ROUTE_BY_CODE[code];
    if (switching) setStatus(badge(code) + " 路線 " + esc(code), route ? route.nameZh : "");
    const my = ++nonce;
    if (!route) {
      boardEl.innerHTML = '<div class="card"><p class="muted">找不到路線 ' + esc(code) + "。</p></div>";
      return;
    }
    if (switching && !boardEl.querySelector("[data-route-board]")) {
      boardEl.innerHTML = '<div class="card loading">正在載入沿線各站班次…</div>';
    } else {
      boardEl.querySelectorAll(".pills").forEach((el) => el.classList.add("updating"));
    }
    inFlight = true;
    try {
      const dirs = await fetchRouteDirs(route);
      if (my !== nonce) return;
      lastRoute = { code, dirs };
      if (silent && boardEl.querySelector("[data-route-board]")) patchRoute(code, dirs);
      else renderRoute(code, dirs);
    } catch (e) {
      if (my !== nonce) return;
      if (!silent) boardEl.innerHTML = '<div class="card"><p class="warn">未能載入路線資料。</p></div>';
    } finally {
      if (my === nonce) inFlight = false;
      boardEl.querySelectorAll(".pills").forEach((el) => el.classList.remove("updating"));
    }
    if (my === nonce) {
      seconds = refreshEvery;
      $("count").textContent = String(seconds);
    }
  }

  function renderRoute(code, dirs) {
    boardEl.innerHTML = dirs.map((d) => {
      let html = '<div class="card" data-route-board="1">' + badge(code) +
        ' <span class="dir-tag">' + (d.circular ? "循環線" : d.dir === 1 ? "去程" : "回程") + "</span>";
      if (d.circular) {
        html += '<div class="dir-title"><span class="zh-name">' + esc(d.origZh) + '</span> <span class="arrow">↺</span> <span class="zh-name">' + esc(d.destZh) + "</span></div>";
        html += '<p class="desc">單向循環 · ' + d.stops.length + " 個車站</p>";
      } else {
        html += '<div class="dir-title"><span class="zh-name">' + esc(d.origZh) + '</span> <span class="arrow">→</span> <span class="zh-name">' + esc(d.destZh) + "</span></div>";
        html += '<p class="desc">' + d.stops.length + " 個車站</p>";
      }
      html += d.stops.map((st) => {
        return '<div class="stop-row"><button type="button" class="stop-name" data-st="' + st.stopId + '">' +
          st.seq + '. <span class="zh-name">' + esc(st.nameZh) + "</span>" +
          '<div class="meta">' + esc(st.nameEn) + (st.interchangeTml ? " · 屯馬綫" : "") + "</div></button>" +
          pills(st.trains, st.error ? "暫時無法取得" : "沒有班次", d.dir + "-" + st.stopId) + "</div>";
      }).join("");
      return html + "</div>";
    }).join("");
  }

  function patchRoute(code, dirs) {
    dirs.forEach((d) => {
      d.stops.forEach((st) => {
        patchPills(d.dir + "-" + st.stopId, st.trains, st.error ? "暫時無法取得" : "沒有班次");
      });
    });
  }

  function reload(forceFull) {
    if (!selection || inFlight) return;
    if (!forceFull && selection.kind === "station" && lastStation && lastStation.id === selection.id) {
      selectStation(selection.id, true);
      return;
    }
    if (!forceFull && selection.kind === "route" && lastRoute && lastRoute.code === selection.code) {
      selectRoute(selection.code, true);
      return;
    }
    if (selection.kind === "station") selectStation(selection.id, false);
    else selectRoute(selection.code, false);
  }
  function goHome() {
    nonce += 1;
    selection = null;
    navStack = [];
    navigatingBack = false;
    setHash("home");
    if (timer) clearInterval(timer);
    suggestEl.hidden = true;
    renderHome();
  }
  function applyHash() {
    const h = (location.hash || "").replace(/^#\/?/, "");
    const st = h.match(/^station\/(\d+)/);
    const rt = h.match(/^route\/(.+)/);
    if (st) {
      const id = Number(st[1]);
      if (!selection || selection.kind !== "station" || selection.id !== id) selectStation(id);
      return;
    }
    if (rt) {
      const code = decodeURIComponent(rt[1]);
      if (!selection || selection.kind !== "route" || selection.code !== code) selectRoute(code);
      return;
    }
    if (selection) goHome();
    else renderHome();
  }

  qEl.addEventListener("input", () => {
    activeIdx = 0;
    showSuggest(searchLrt(qEl.value));
  });
  qEl.addEventListener("focus", () => {
    if (qEl.value.trim()) showSuggest(searchLrt(qEl.value));
  });
  qEl.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); activeIdx = Math.min(activeIdx + 1, Math.max(0, lastHits.length - 1)); showSuggest(lastHits); }
    else if (e.key === "ArrowUp") { e.preventDefault(); activeIdx = Math.max(activeIdx - 1, 0); showSuggest(lastHits); }
    else if (e.key === "Enter") { e.preventDefault(); const h = lastHits[activeIdx] || lastHits[0]; if (h) pickHit(h); }
    else if (e.key === "Escape") suggestEl.hidden = true;
  });
  $("searchBtn").addEventListener("click", () => {
    const hits = searchLrt(qEl.value);
    const h = hits[activeIdx] || hits[0];
    if (h) pickHit(h);
  });
  suggestEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-i]");
    if (!btn) return;
    const h = lastHits[Number(btn.getAttribute("data-i"))];
    if (h) pickHit(h);
  });
  document.addEventListener("mousedown", (e) => {
    if (!e.target.closest(".search")) suggestEl.hidden = true;
  });
  document.addEventListener("click", (e) => {
    const st = e.target.closest("[data-st]");
    if (st) { selectStation(Number(st.getAttribute("data-st"))); return; }
    const rt = e.target.closest("[data-rt]");
    if (rt) { selectRoute(rt.getAttribute("data-rt")); }
  });
  backBtn.addEventListener("click", goBack);
  headerBackBtn.addEventListener("click", goBack);
  $("homeBtn").addEventListener("click", goHome);
  $("refreshBtn").addEventListener("click", reload);
  $("refreshEvery").addEventListener("change", (e) => {
    const n = Number(e.target.value);
    if (n !== 10 && n !== 12 && n !== 15) return;
    refreshEvery = n;
    seconds = refreshEvery;
    $("count").textContent = String(seconds);
    try { localStorage.setItem(REFRESH_KEY, JSON.stringify(refreshEvery)); } catch (err) {}
    if (selection) startClock();
  });
  window.addEventListener("hashchange", applyHash);

  applyHash();
})();
</script>
</body>
</html>
